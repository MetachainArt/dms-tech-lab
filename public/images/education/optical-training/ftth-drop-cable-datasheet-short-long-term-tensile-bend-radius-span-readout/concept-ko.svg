<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="34" font-weight="700" fill="#242424" >인장·굽힘·경간을 읽는 순서</text><text x="65" y="116" font-size="22" font-weight="400" fill="#6a6a6a" >Prysmian, CommScope, Furukawa, STL, Waveoptics, FS, Digisol 등 17건 기준 · 개념도</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">인장하중</text><text x="210" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">단기 · 장기 · 설치 · 운용</text><text x="210" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">라벨 순서와 단위 먼저 읽기</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">굽힘 반경</text><text x="600" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">mm 또는 지름 배수</text><text x="600" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">배수는 어느 치수에 곱했는지</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">자가지지 경간</text><text x="990" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">하중 조건 · 처짐 %</text><text x="990" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">경간 줄이 없으면 판정 불가</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="16" font-weight="700" fill="#242424" text-anchor="middle">케이블 줄과 커넥터 조립품 줄은 따로 적습니다</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">같은 제품명이어도 문서마다 값이 다릅니다</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">기록: 문서 코드와 쪽 번호 · 단기와 장기의 이름과 순서 · 굽힘 기준 치수</text><text x="600" y="584" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">하중 조건과 처짐 · 설치 온도 줄 · 어긋난 숫자는 두 값</text><text x="65" y="645" font-size="22" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>