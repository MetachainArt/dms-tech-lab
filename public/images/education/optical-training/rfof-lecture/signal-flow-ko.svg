<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc"><title id="title">RF 신호가 지나가는 경로</title><desc id="desc">송신기와 수신기 양끝에 전원이 필요합니다</desc><rect width="720" height="960" fill="#FFFFFF"/><g font-family="Malgun Gothic,Arial,sans-serif" fill="#262626"><text x="40" y="65" font-size="38" font-weight="700">RF 신호가 지나가는 경로</text><text x="40" y="112" font-size="27" font-weight="400">빛으로 전달하고 전기 신호로 복원합니다</text><rect x="40" y="160" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="208" font-size="34" font-weight="700">RF 입력</text><text x="65" y="249" font-size="26" font-weight="400">입력 레벨 · 정합 · 필터</text><path d="M360 309v35m-10-10 10 10 10-10" fill="none" stroke="#262626" stroke-width="3"/><rect x="40" y="345" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="393" font-size="34" font-weight="700">광변환</text><text x="65" y="434" font-size="26" font-weight="400">광원 직접 변조 또는 외부 변조</text><path d="M360 494v35m-10-10 10 10 10-10" fill="none" stroke="#262626" stroke-width="3"/><rect x="40" y="530" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="578" font-size="34" font-weight="700">광선로</text><text x="65" y="619" font-size="26" font-weight="400">광섬유 · 접속부 · 광손실 · 분산</text><path d="M360 679v35m-10-10 10 10 10-10" fill="none" stroke="#262626" stroke-width="3"/><rect x="40" y="715" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="763" font-size="34" font-weight="700">광검출과 RF 출력</text><text x="65" y="804" font-size="26" font-weight="400">광검출기 · 출력 회로 · 후단 조건</text><text x="40" y="923" font-size="25" font-weight="400">송신기와 수신기 양끝에 전원이 필요합니다</text></g></svg>