<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc"><title id="title">Keep test scopes distinct</title><desc id="desc">Plant acceptance is not RF acceptance</desc><rect width="720" height="960" fill="#FFFFFF"/><g font-family="Malgun Gothic,Arial,sans-serif" fill="#262626"><text x="40" y="65" font-size="36" font-weight="700">Keep test scopes distinct</text><text x="40" y="112" font-size="26" font-weight="400">Plant acceptance is not RF acceptance</text><rect x="40" y="160" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="208" font-size="34" font-weight="700">Optical-plant tests</text><text x="65" y="249" font-size="26" font-weight="400">Interfaces, loss and received power</text><text x="65" y="282" font-size="26" font-weight="400">OTDR identifies optical-path events</text><path d="M360 310v35m-10-10 10 10 10-10" fill="none" stroke="#262626" stroke-width="3"/><rect x="40" y="350" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="398" font-size="34" font-weight="700">RF-performance tests</text><text x="65" y="439" font-size="26" font-weight="400">Response, noise and distortion</text><text x="65" y="472" font-size="26" font-weight="400">Phase and delay where required</text><path d="M360 500v35m-10-10 10 10 10-10" fill="none" stroke="#262626" stroke-width="3"/><rect x="40" y="540" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="588" font-size="34" font-weight="700">System acceptance</text><text x="65" y="629" font-size="26" font-weight="400">Service, monitoring, fault response</text><text x="65" y="662" font-size="26" font-weight="400">Combined equipment and fiber path</text><text x="40" y="830" font-size="28" font-weight="700">Link evidence to its target and conditions</text><text x="40" y="878" font-size="25" font-weight="400">Link ID, direction, equipment, original files</text></g></svg>