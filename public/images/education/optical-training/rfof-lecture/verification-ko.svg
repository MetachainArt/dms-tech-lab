<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc"><title id="title">측정의 범위를 구분합니다</title><desc id="desc">광선로 합격과 RF 성능 합격은 다릅니다</desc><rect width="720" height="960" fill="#FFFFFF"/><g font-family="Malgun Gothic,Arial,sans-serif" fill="#262626"><text x="40" y="65" font-size="36" font-weight="700">측정의 범위를 구분합니다</text><text x="40" y="112" font-size="26" font-weight="400">광선로 합격과 RF 성능 합격은 다릅니다</text><rect x="40" y="160" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="208" font-size="34" font-weight="700">광선로 시험</text><text x="65" y="249" font-size="26" font-weight="400">접속면 · 광손실 · 수신 광파워</text><text x="65" y="282" font-size="26" font-weight="400">OTDR은 광 이벤트를 확인합니다</text><path d="M360 310v35m-10-10 10 10 10-10" fill="none" stroke="#262626" stroke-width="3"/><rect x="40" y="350" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="398" font-size="34" font-weight="700">RF 성능 시험</text><text x="65" y="439" font-size="26" font-weight="400">응답 · 잡음 · 압축 · 상호변조</text><text x="65" y="472" font-size="26" font-weight="400">요구에 따라 위상과 군지연 확인</text><path d="M360 500v35m-10-10 10 10 10-10" fill="none" stroke="#262626" stroke-width="3"/><rect x="40" y="540" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="588" font-size="34" font-weight="700">시스템 인수</text><text x="65" y="629" font-size="26" font-weight="400">서비스 요구 · 감시 · 장애 대응</text><text x="65" y="662" font-size="26" font-weight="400">장비와 광선로를 결합해 확인</text><text x="40" y="830" font-size="28" font-weight="700">모든 결과를 대상과 조건에 연결합니다</text><text x="40" y="878" font-size="25" font-weight="400">링크 ID · 방향 · 장비 · 계측 원본</text></g></svg>