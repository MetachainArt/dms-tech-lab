<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc"><title id="title">The RF signal path</title><desc id="desc">Both transmitter and receiver require power.</desc><rect width="720" height="960" fill="#FFFFFF"/><g font-family="Malgun Gothic,Arial,sans-serif" fill="#262626"><text x="40" y="65" font-size="38" font-weight="700">The RF signal path</text><text x="40" y="112" font-size="27" font-weight="400">Optical transport, electrical recovery</text><rect x="40" y="160" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="208" font-size="34" font-weight="700">RF input</text><text x="65" y="249" font-size="26" font-weight="400">Level, impedance and filtering</text><path d="M360 309v35m-10-10 10 10 10-10" fill="none" stroke="#262626" stroke-width="3"/><rect x="40" y="345" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="393" font-size="34" font-weight="700">Optical conversion</text><text x="65" y="434" font-size="26" font-weight="400">Direct or external modulation</text><path d="M360 494v35m-10-10 10 10 10-10" fill="none" stroke="#262626" stroke-width="3"/><rect x="40" y="530" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="578" font-size="34" font-weight="700">Fiber path</text><text x="65" y="619" font-size="26" font-weight="400">Fiber, joints, loss and dispersion</text><path d="M360 679v35m-10-10 10 10 10-10" fill="none" stroke="#262626" stroke-width="3"/><rect x="40" y="715" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="763" font-size="34" font-weight="700">RF recovery</text><text x="65" y="804" font-size="26" font-weight="400">Photodetection and output circuits</text><text x="40" y="923" font-size="25" font-weight="400">Both transmitter and receiver require power.</text></g></svg>