<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc"><title id="title">RF 품질은 따로 확인합니다</title><desc id="desc">한 지표로 전체 링크를 판정하지 않습니다</desc><rect width="720" height="960" fill="#FFFFFF"/><g font-family="Malgun Gothic,Arial,sans-serif" fill="#262626"><text x="40" y="65" font-size="36" font-weight="700">RF 품질은 따로 확인합니다</text><text x="40" y="112" font-size="26" font-weight="400">한 지표로 전체 링크를 판정하지 않습니다</text><rect x="40" y="160" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="208" font-size="34" font-weight="700">이득과 주파수 응답</text><text x="65" y="249" font-size="26" font-weight="400">얼마나 전달되는지 · 대역별 변화</text><rect x="40" y="340" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="388" font-size="34" font-weight="700">잡음지수</text><text x="65" y="429" font-size="26" font-weight="400">입출력 신호대잡음비의 차이</text><rect x="40" y="520" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="568" font-size="34" font-weight="700">선형성과 동적 범위</text><text x="65" y="609" font-size="26" font-weight="400">압축 · 상호변조 · SFDR</text><rect x="40" y="724" width="640" height="196" rx="10" fill="#262626"/><text x="65" y="774" font-size="30" font-weight="700" fill="#FFFFFF">비교 조건을 함께 기록합니다</text><text x="65" y="822" font-size="25" font-weight="400" fill="#FFFFFF">기준면 · 입력 레벨 · 대역폭 · 온도</text><text x="65" y="870" font-size="25" font-weight="400" fill="#FFFFFF">광길이 · 손실 · 파장 · 장비 설정</text></g></svg>