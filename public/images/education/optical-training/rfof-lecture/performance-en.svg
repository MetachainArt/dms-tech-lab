<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc"><title id="title">Separate RF quality judgments</title><desc id="desc">One metric cannot establish link quality</desc><rect width="720" height="960" fill="#FFFFFF"/><g font-family="Malgun Gothic,Arial,sans-serif" fill="#262626"><text x="40" y="65" font-size="36" font-weight="700">Separate RF quality judgments</text><text x="40" y="112" font-size="26" font-weight="400">One metric cannot establish link quality</text><rect x="40" y="160" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="208" font-size="34" font-weight="700">Gain and response</text><text x="65" y="249" font-size="26" font-weight="400">Transferred level across the RF band</text><rect x="40" y="340" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="388" font-size="34" font-weight="700">Noise figure</text><text x="65" y="429" font-size="26" font-weight="400">Degradation in signal-to-noise ratio</text><rect x="40" y="520" width="640" height="140" rx="10" fill="#F3F3F3" stroke="#707070" stroke-width="2"/><text x="65" y="568" font-size="34" font-weight="700">Linearity and range</text><text x="65" y="609" font-size="26" font-weight="400">Compression, intermodulation, SFDR</text><rect x="40" y="724" width="640" height="196" rx="10" fill="#262626"/><text x="65" y="774" font-size="30" font-weight="700" fill="#FFFFFF">Record comparable test conditions</text><text x="65" y="822" font-size="25" font-weight="400" fill="#FFFFFF">Planes, input level, bandwidth, temperature</text><text x="65" y="870" font-size="25" font-weight="400" fill="#FFFFFF">Fiber length, loss, wavelength, configuration</text></g></svg>