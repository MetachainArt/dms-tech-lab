<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="58" font-size="32" font-weight="700" fill="#242424" >단일 광섬유 시야 가로 폭 비교</text><text x="65" y="88" font-size="15" font-weight="400" fill="#6a6a6a" >제조사 문서의 시야 숫자와 클래딩 125 µm(일반값)로 DMS가 계산한 비율 · 영상 종류와 배율이 서로 다름</text><text x="65" y="148" font-size="19" font-weight="700" fill="#242424" >VIAVI P5000i 높은 배율</text><text x="65" y="174" font-size="15" font-weight="400" fill="#6a6a6a" >데이터시트 · 이중 배율 200X/400X</text><rect x="330" y="122" width="351.5" height="30" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><rect x="330" y="122" width="118.75" height="30" fill="#555555" stroke="#262626" stroke-width="1.4"/><text x="691.5" y="143" font-size="16" font-weight="700" fill="#242424" >370 µm</text><text x="330" y="176" font-size="15" font-weight="400" fill="#242424" >클래딩 125 µm = 시야 폭의 33.8%</text><text x="65" y="252" font-size="19" font-weight="700" fill="#242424" >Fluke FI-3000</text><text x="65" y="278" font-size="15" font-weight="400" fill="#6a6a6a" >데이터시트 · 배율 숫자 없음</text><rect x="330" y="226" width="579.5" height="30" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><rect x="330" y="226" width="118.75" height="30" fill="#555555" stroke="#262626" stroke-width="1.4"/><text x="919.5" y="247" font-size="16" font-weight="700" fill="#242424" >610 µm</text><text x="330" y="280" font-size="15" font-weight="400" fill="#242424" >클래딩 125 µm = 시야 폭의 20.5%</text><text x="65" y="356" font-size="19" font-weight="700" fill="#242424" >VIAVI P5000i 낮은 배율</text><text x="65" y="382" font-size="15" font-weight="400" fill="#6a6a6a" >데이터시트 · 이중 배율 200X/400X</text><rect x="330" y="330" width="703" height="30" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><rect x="330" y="330" width="118.75" height="30" fill="#555555" stroke="#262626" stroke-width="1.4"/><text x="1043" y="351" font-size="16" font-weight="700" fill="#242424" >740 µm</text><text x="330" y="384" font-size="15" font-weight="400" fill="#242424" >클래딩 125 µm = 시야 폭의 16.9%</text><text x="65" y="460" font-size="19" font-weight="700" fill="#242424" >EXFO FIP-500 단일</text><text x="65" y="486" font-size="15" font-weight="400" fill="#6a6a6a" >사양서 · 배율 숫자 없음</text><rect x="330" y="434" width="712.5" height="30" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><rect x="330" y="434" width="118.75" height="30" fill="#555555" stroke="#262626" stroke-width="1.4"/><text x="1052.5" y="455" font-size="16" font-weight="700" fill="#242424" >750 µm</text><text x="330" y="488" font-size="15" font-weight="400" fill="#242424" >클래딩 125 µm = 시야 폭의 16.7%</text><path d="M330 112 L330 546" stroke="#262626" stroke-width="1.6"/><path d="M330 546 L1090 546" stroke="#262626" stroke-width="1.6"/><path d="M330 546 L330 554" stroke="#262626" stroke-width="1.4"/><text x="330" y="574" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0</text><path d="M425 546 L425 554" stroke="#262626" stroke-width="1.4"/><text x="425" y="574" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">100</text><path d="M520 546 L520 554" stroke="#262626" stroke-width="1.4"/><text x="520" y="574" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">200</text><path d="M615 546 L615 554" stroke="#262626" stroke-width="1.4"/><text x="615" y="574" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">300</text><path d="M710 546 L710 554" stroke="#262626" stroke-width="1.4"/><text x="710" y="574" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">400</text><path d="M805 546 L805 554" stroke="#262626" stroke-width="1.4"/><text x="805" y="574" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">500</text><path d="M900 546 L900 554" stroke="#262626" stroke-width="1.4"/><text x="900" y="574" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="m