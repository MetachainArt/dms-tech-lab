<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="30" font-weight="700" fill="#242424" >Order for reading an insertion loss line</text><text x="65" y="116" font-size="20" font-weight="400" fill="#6a6a6a" >Based on Senko, Rosenberger, Corning, RDM and XFS documents and US Conec material · concept diagram</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="21" font-weight="700" fill="#242424" text-anchor="middle">Kind of value</text><text x="210" y="290" font-size="14" font-weight="400" fill="#6a6a6a" text-anchor="middle">typical, mean or maximum</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="21" font-weight="700" fill="#242424" text-anchor="middle">Partner condition</text><text x="600" y="290" font-size="14" font-weight="400" fill="#6a6a6a" text-anchor="middle">reference, random, finished trunk</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="21" font-weight="700" fill="#242424" text-anchor="middle">Printed loss</text><text x="990" y="290" font-size="14" font-weight="400" fill="#6a6a6a" text-anchor="middle">the number, its share, the note</text><text x="404" y="228" font-size="40" font-weight="700" fill="#242424" text-anchor="middle">×</text><text x="794" y="228" font-size="40" font-weight="700" fill="#242424" text-anchor="middle">=</text><rect x="65" y="330" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="368" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">Example: the Senko low loss 12-fibre maximum of 0.25 dB holds for 95% of fibres · reference jumper and test method basis</text><path d="M600 300 L600 328" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 318.0950818741206 L600 328 L604.7846208752235 318.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 392 L600 424" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 414.0950818741206 L600 424 L604.7846208752235 414.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="426" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="464" font-size="12.2" font-weight="700" fill="#242424" text-anchor="middle">Pins on one side of every mating plane: a pinned side pairs with an unpinned side, and which side is pinned follows a different convention in each document</text><path d="M600 488 L600 520" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 510.0950818741206 L600 520 L604.7846208752235 510.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="522" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="552" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">Record: document number and page, kind of value, partner condition</text><text x="600" y="578" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">polish type and fibre count, allowed loss change next to the cycle count</text><text x="65" y="645" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>