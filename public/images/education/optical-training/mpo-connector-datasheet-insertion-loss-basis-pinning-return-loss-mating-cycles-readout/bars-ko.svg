<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="52" font-size="30" font-weight="700" fill="#242424" >12심 단일모드 접속 한 쌍의 삽입손실 (dB)</text><text x="65" y="80" font-size="14" font-weight="400" fill="#6a6a6a" >짙은 막대는 대표값 또는 평균값, 옅은 막대는 최대값 · 문서마다 시험 조건이 다름</text><rect x="720" y="98" width="22" height="14" fill="#555555" stroke="#262626" stroke-width="1.4"/><text x="750" y="110" font-size="15" font-weight="700" fill="#242424" >대표값 또는 평균값</text><rect x="950" y="98" width="22" height="14" fill="#d8d6cf" stroke="#262626" stroke-width="1.4"/><text x="980" y="110" font-size="15" font-weight="700" fill="#242424" >최대값</text><text x="65" y="158" font-size="16" font-weight="700" fill="#242424" >Senko 저손실형</text><rect x="520" y="132" width="80" height="20" fill="#555555" stroke="#262626" stroke-width="1.4"/><text x="608" y="148" font-size="14" font-weight="700" fill="#242424" >0.10</text><rect x="520" y="154" width="200" height="20" fill="#d8d6cf" stroke="#262626" stroke-width="1.4"/><text x="728" y="170" font-size="14" font-weight="700" fill="#242424" >0.25</text><text x="65" y="213" font-size="16" font-weight="700" fill="#242424" >Senko 표준형</text><rect x="520" y="187" width="160" height="20" fill="#555555" stroke="#262626" stroke-width="1.4"/><text x="688" y="203" font-size="14" font-weight="700" fill="#242424" >0.20</text><rect x="520" y="209" width="560" height="20" fill="#d8d6cf" stroke="#262626" stroke-width="1.4"/><text x="1088" y="225" font-size="14" font-weight="700" fill="#242424" >0.70</text><text x="65" y="268" font-size="16" font-weight="700" fill="#242424" >Rosenberger PURE (평균은 무작위 접속)</text><rect x="520" y="242" width="120" height="20" fill="#555555" stroke="#262626" stroke-width="1.4"/><text x="648" y="258" font-size="14" font-weight="700" fill="#242424" >0.15</text><rect x="520" y="264" width="200" height="20" fill=