<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="36" font-weight="700" fill="#242424" >추정 손실과 OTDR 값은 다른 근거에서 나온다</text><text x="65" y="116" font-size="23" font-weight="400" fill="#6a6a6a" >제조사 자료 기준 · 개념도</text><rect x="65" y="160" width="500" height="380" fill="none" stroke="#262626" stroke-width="2"/><text x="90" y="205" font-size="28" font-weight="700" fill="#242424" >융착기 추정</text><rect x="110" y="250" width="410" height="52" fill="none" stroke="#262626" stroke-width="2"/><text x="315" y="284" font-size="23" font-weight="400" fill="#242424" text-anchor="middle">접속부 영상</text><path d="M315 302 L315 338" stroke="#262626" stroke-width="2" fill="none"/><path d="M310.21537912477646 328.0950818741206 L315 338 L319.78462087522354 328.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="110" y="340" width="410" height="52" fill="none" stroke="#262626" stroke-width="2"/><text x="315" y="374" font-size="23" font-weight="400" fill="#242424" text-anchor="middle">어긋남 계산</text><path d="M315 392 L315 428" stroke="#262626" stroke-width="2" fill="none"/><path d="M310.21537912477646 418.0950818741206 L315 428 L319.78462087522354 418.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="110" y="430" width="410" height="52" fill="none" stroke="#262626" stroke-width="2"/><text x="315" y="464" font-size="23" font-weight="400" fill="#242424" text-anchor="middle">추정 손실 표시</text><rect x="635" y="160" width="500" height="380" fill="none" stroke="#262626" stroke-width="2"/><text x="660" y="205" font-size="28" font-weight="700" fill="#242424" >OTDR 한 방향</text><path d="M660 262 L815 280 L815 322 L1110 350" stroke="#262626" stroke-width="3" fill="none"/><text x="1110" y="246" font-size="20" font-weight="400" fill="#242424" text-anchor="end">A → B: 과장된 손실</text><path d="M660 440 L815 458 L815 438 L1110 468" stroke="#6a6a6a" stroke-width="3" fill="none"/><text x="1110" y="422" font-size="20" font-weight="400" fill="#6a6a6a" text-anchor="end">B → A: 겉보기 이득</text><path d="M815 262 L815 515" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="6 6" fill="none"/><text x="825" y="515" font-size="19" font-weight="400" fill="#6a6a6a" >접속</text><text x="65" y="625" font-size="34" font-weight="700" fill="#242424" >양방향 평균으로 접속 손실을 판단</text></g></svg>