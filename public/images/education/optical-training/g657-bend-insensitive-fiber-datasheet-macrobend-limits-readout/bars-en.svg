 fill="#6a6a6a" text-anchor="middle">dB</text><text x="65" y="660" font-size="13.5" font-weight="400" fill="#242424" >The A1 limit is 7.5 times the A2 limit. A sheet value below the A1 limit but above the A2 limit is not called A2.</text></g></svg>