<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="34" font-weight="700" fill="#242424" >굽힘 손실 한 줄을 읽는 순서</text><text x="65" y="116" font-size="23" font-weight="400" fill="#6a6a6a" >ITU-T G.657과 제조사 시트 기준 · 개념도</text><rect x="65" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="160" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">범주 표기</text><text x="160" y="308" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">시트 문장과 표의 대조</text><path d="M257 232 L277 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M267.0950818741206 236.78462087522354 L277 232 L267.0950818741206 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="279" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="374" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">맨드럴 반경</text><text x="374" y="308" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">mm · 지름 아님</text><path d="M471 232 L491 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M481.0950818741206 236.78462087522354 L491 232 L481.0950818741206 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="493" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="588" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">감은 횟수</text><text x="588" y="308" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">1회 또는 10회</text><path d="M685 232 L705 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M695.0950818741205 236.78462087522354 L705 232 L695.0950818741205 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="707" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="802" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">파장</text><text x="802" y="308" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">1550 또는 1625 nm</text><path d="M899 232 L919 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M909.0950818741205 236.78462087522354 L919 232 L909.0950818741205 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="921" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="1016" y="240" font-size="19" font-weight="700" fill="#242424" text-anchor="middle">최대 추가 손실</text><text x="1016" y="308" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">dB, 최대 한도</text><rect x="65" y="370" width="1070" height="66" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="412" font-size="19" font-weight="700" fill="#242424" text-anchor="middle">한도는 광섬유 한 가닥(케이블 없음) 조건이며 케이블·트레이·함체의 조건은 별도 문서에서 확인</text><path d="M160 314 L160 368" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M155.21537912477646 358.0950818741206 L160 368 L164.78462087522354 358.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 436 L600 478" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 468.0950818741206 L600 478 L604.7846208752235 468.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="480" width="1070" height="66" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="522" font-size="18" font-weight="700" fill="#242424" text-anchor="middle">기록: 반경 · 횟수 · 파장 · dB · 문서 번호와 발행일 · 도면의 가이드 반경(반경 또는 지름 표시)</text><text x="65" y="645" font-size="22" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>