<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="30" font-weight="700" fill="#242424" >Order from heater program selection to the record</text><text x="65" y="116" font-size="23" font-weight="400" fill="#6a6a6a" >Based on manufacturer documents · concept diagram</text><rect x="65" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="160" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Sleeve check</text><text x="160" y="308" font-size="14" font-weight="400" fill="#6a6a6a" text-anchor="middle">part no. · length · coating</text><path d="M257 232 L277 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M267.0950818741206 236.78462087522354 L277 232 L267.0950818741206 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="279" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="374" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Program</text><text x="374" y="308" font-size="14" font-weight="400" fill="#6a6a6a" text-anchor="middle">built for the part no.</text><path d="M471 232 L491 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M481.0950818741206 236.78462087522354 L491 232 L481.0950818741206 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="493" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="588" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Placement</text><text x="588" y="308" font-size="14" font-weight="400" fill="#6a6a6a" text-anchor="middle">center mark · yellow lines</text><path d="M685 232 L705 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M695.0950818741205 236.78462087522354 L705 232 L695.0950818741205 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="707" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="802" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Heat and cool</text><text x="802" y="308" font-size="14" font-weight="400" fill="#6a6a6a" text-anchor="middle">do not open until end signal</text><path d="M899 232 L919 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M909.0950818741205 236.78462087522354 L919 232 L909.0950818741205 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="921" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="1016" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Read result</text><text x="1016" y="308" font-size="14" font-weight="400" fill="#6a6a6a" text-anchor="middle">position · end · bubbles · shape</text><rect x="65" y="370" width="1070" height="66" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="412" font-size="19" font-weight="700" fill="#242424" text-anchor="middle">When the result is poor: position → heating plate → setting (one item at a time, note the old value)</text><path d="M1016 314 L1016 368" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M1011.2153791247765 358.0950818741206 L1016 368 L1020.7846208752235 358.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 436 L600 478" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 468.0950818741206 L600 478 L604.7846208752235 468.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="480" width="1070" height="66" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="522" font-size="19" font-weight="700" fill="#242424" text-anchor="middle">Record: model · edition · part no. · program · changed value · ambient temp.</text><text x="65" y="645" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>