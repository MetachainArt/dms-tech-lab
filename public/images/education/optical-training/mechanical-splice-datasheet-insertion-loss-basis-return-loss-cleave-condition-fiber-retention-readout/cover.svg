<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="70" y="95" font-size="25" font-weight="400" fill="#242424" >DMS / OPTICAL TRAINING</text><text x="70" y="185" font-size="50" font-weight="700" fill="#242424" >MECHANICAL SPLICE</text><text x="70" y="246" font-size="50" font-weight="700" fill="#242424" >DATASHEET READOUT</text><text x="70" y="330" font-size="17" font-weight="400" fill="#6a6a6a" >TWO CLEAVED FIBERS IN ONE V-GROOVE BODY</text><path d="M70 430 L255 430" stroke="#262626" stroke-width="2.6" fill="none"/><text x="70" y="414" font-size="15" font-weight="700" fill="#242424" >FIBER A</text><rect x="255" y="388" width="190" height="84" fill="#d9d9d9" stroke="#262626" stroke-width="2.6"/><path d="M350 388 L350 472" stroke="#262626" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/><text x="350" y="500" font-size="15" font-weight="700" fill="#242424" text-anchor="middle">GEL</text><path d="M445 430 L630 430" stroke="#262626" stroke-width="2.6" fill="none"/><text x="630" y="414" font-size="15" font-weight="700" fill="#242424" text-anchor="end">FIBER B</text><text x="70" y="560" font-size="15" font-weight="400" fill="#6a6a6a" >LOSS BASIS, CLEAVE AND SIGN, RETENTION UNIT DIFFER BY SHEET</text><rect x="690" y="300" width="430" height="285" rx="6" fill="none" stroke="#262626" stroke-width="2.6"/><text x="712" y="345" font-size="19" font-weight="700" fill="#242424" >INSERTION LOSS</text><text x="1098" y="345" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="end">AVERAGE OR MAXIMUM</text><path d="M712 357 L1098 357" stroke="#9a9a9a" stroke-width="1.2" fill="none"/><text x="712" y="392" font-size="19" font-weight="700" fill="#242424" >RETURN LOSS</text><text x="1098" y="392" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="end">CLEAVE · SIGN</text><path d="M712 404 L1098 404" stroke="#9a9a9a" stroke-width="1.2" fill="none"/><text x="712" y="439" font-size="19" font-weight="700" fill="#242424" >RETENTION</text><text x="1098" y="439" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="end">N · HELD ITEM</text><path d="M712 451 L1098 451" stroke="#9a9a9a" stroke-width="1.2" fill="none"/><text x="712" y="486" font-size="19" font-weight="700" fill="#242424" >TEMPERATURE</text><text x="1098" y="486" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="end">COATING · RANGE</text><path d="M712 498 L1098 498" stroke="#9a9a9a" stroke-width="1.2" fill="none"/><text x="712" y="533" font-size="19" font-weight="700" fill="#242424" >PROCEDURE</text><text x="1098" y="533" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="end">CLEAVE LENGTH · TOOL</text><path d="M712 545 L1098 545" stroke="#9a9a9a" stroke-width="1.2" fill="none"/><text x="690" y="625" font-size="17" font-weight="400" fill="#242424" >WHICH BASIS, WHICH CLEAVE, WHICH HELD ITEM</text></g></svg>