<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="27" font-weight="700" fill="#242424" >Order for reading a mechanical splice datasheet</text><text x="65" y="116" font-size="15.5" font-weight="400" fill="#6a6a6a" >Based on 14 manufacturer and distributor documents, ITU-T L.400, a military specification and FOA material · concept diagram</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="21" font-weight="700" fill="#242424" text-anchor="middle">Loss basis</text><text x="210" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">average, maximum, guarantee</text><text x="210" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">Multiply by the number of splices</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="21" font-weight="700" fill="#242424" text-anchor="middle">Return loss</text><text x="600" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">cleave type, temperature, sign</text><text x="600" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">Check against the application standard</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="21" font-weight="700" fill="#242424" text-anchor="middle">Retention and conditions</text><text x="990" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">unit and held item</text><text x="990" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">Unify in newtons before comparing</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="12" font-weight="700" fill="#242424" text-anchor="middle">Copy the operating temperature, coating limits, reuse count and the slack lost on re-splicing</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="12.2" font-weight="700" fill="#242424" text-anchor="middle">Before the test: check that the cleave length, cleaver and assembly tool match the premise of the value</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="12.2" font-weight="700" fill="#242424" text-anchor="middle">Record: document code, edition, date, loss basis and sum for the splice count, cleave type and sign</text><text x="600" y="584" font-size="12.2" font-weight="700" fill="#242424" text-anchor="middle">retention in N and held item, operating temperature, reuse count, cleave length and tools</text><text x="65" y="645" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>