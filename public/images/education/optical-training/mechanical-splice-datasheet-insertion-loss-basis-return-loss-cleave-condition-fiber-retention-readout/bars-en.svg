62626" stroke-width="2"/><text x="536.875" y="317" font-size="17" font-weight="700" fill="#242424" >0.90</text><path d="M65 345 L1180 345" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="381" font-size="18" font-weight="700" fill="#242424" >Optix · Focomm</text><text x="65" y="403" font-size="12.5" font-weight="400" fill="#6a6a6a" >0.25 (basis not stated)</text><rect x="330" y="361" width="328.125" height="40" fill="#d6d6d6" stroke="#262626" stroke-width="2"/><text x="668.125" y="388" font-size="17" font-weight="700" fill="#242424" >1.50</text><path d="M65 416 L1180 416" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="452" font-size="18" font-weight="700" fill="#242424" >Dintek</text><text x="65" y="474" font-size="12.5" font-weight="400" fill="#6a6a6a" >maximum 0.3</text><rect x="330" y="432" width="393.75" height="40" fill="#6a6a6a" stroke="#262626" stroke-width="2"/><text x="711.75" y="459" font-size="17" font-weight="700" fill="#f4f3ef" text-anchor="end">1.80</text><path d="M65 487 L1180 487" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="523" font-size="18" font-weight="700" fill="#242424" >ITU-T L.400 grade C</text><text x="65" y="545" font-size="12.5" font-weight="400" fill="#6a6a6a" >maximum 0.5</text><rect x="330" y="503" width="656.25" height="40" fill="#6a6a6a" stroke="#262626" stroke-width="2"/><text x="974.25" y="530" font-size="17" font-weight="700" fill="#f4f3ef" text-anchor="end">3.00</text><path d="M65 558 L1180 558" stroke="#d0cfc9" stroke-width="1" fill="none"/><path d="M330 560 L330 568" stroke="#6a6a6a" stroke-width="1.4" fill="none"/><text x="330" y="584" font-size="12" font-weight="700" fill="#6a6a6a" text-anchor="middle">0.0</text><path d="M439.375 560 L439.375 568" stroke="#6a6a6a" stroke-width="1.4" fill="none"/><text x="439.375" y="584" font-size="12" font-weight="700" fill="#6a6a6a" text-anchor="middle">0.5</text><path d="M548.75 560 L548.75 568" stroke="#6a6a6a" stroke-width="1.4" fill="none"