<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="34" font-weight="700" fill="#242424" >기계식 접속자 사양서를 읽는 순서</text><text x="65" y="116" font-size="19" font-weight="400" fill="#6a6a6a" >제조사·유통사 문서 14건과 ITU-T L.400, 군용 규격, FOA 자료 기준 · 개념도</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">손실 기준</text><text x="210" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">평균 · 최대 · 보증</text><text x="210" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">접속 개수를 곱해 비교합니다</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">반사 조건</text><text x="600" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">절단면 · 온도 · 부호</text><text x="600" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">용도의 기준과 대조합니다</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">고정력·조건</text><text x="990" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">단위 · 잡는 대상</text><text x="990" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">뉴턴으로 통일해 비교합니다</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="15" font-weight="700" fill="#242424" text-anchor="middle">사용 온도, 피복 재질별 한도, 재사용 횟수, 재접속 때 줄어드는 여장을 함께 옮깁니다</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">시험 전: 값의 전제인 절단 길이, 절단기, 조립 도구가 쓰는 것과 같은지 확인합니다</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">기록: 문서 코드·판·날짜 · 삽입손실 기준과 접속 개수 합 · 반사 절단면과 부호</text><text x="600" y="584" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">고정력(N)과 잡는 대상 · 사용 온도 · 재사용 횟수 · 절단 길이와 도구</text><text x="65" y="645" font-size="22" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>