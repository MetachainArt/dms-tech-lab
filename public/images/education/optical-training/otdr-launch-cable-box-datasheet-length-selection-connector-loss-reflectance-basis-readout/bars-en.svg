<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="42" font-size="24" font-weight="700" fill="#242424" >Distance the OTDR pulse width occupies and launch cable product lengths</text><text x="65" y="64" font-size="10" font-weight="400" fill="#6a6a6a" >Bars are the distance the pulse occupies (group index 1.468 assumed), dashed lines are the product lengths EXFO offers · logarithmic axis · a DMS calculation, not a tested value</text><text x="230" y="122" font-size="14" font-weight="700" fill="#6a6a6a" >Product length</text><text x="1040" y="122" font-size="14" font-weight="700" fill="#6a6a6a" >Fits</text><path d="M362.2402320908219 136 L362.2402320908219 492" stroke="#262626" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/><text x="362.2402320908219" y="122" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">15 m</text><path d="M639.4029675227637 136 L639.4029675227637 492" stroke="#262626" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/><text x="639.4029675227637" y="122" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">150 m</text><path d="M722.8372645680582 136 L722.8372645680582 492" stroke="#262626" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/><text x="722.8372645680582" y="122" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">300 m</text><path d="M784.3254708638835 136 L784.3254708638835 492" stroke="#262626" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/><text x="784.3254708638835" y="122" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">500 m</text><path d="M867.7597679091781 136 L867.7597679091781 492" stroke="#262626" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/><text x="867.7597679091781" y="122" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">1000 m</text><path d="M962.6665747997995 136 L962.6665747997995 492" stroke="#262626" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/><text x="962.6665747997995" y="122" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">2200 m</text><text x="65" y="146" font-size="14" font-weight="700" fill="#6a6a6a" >Pulse width</text><text x="65" y="186" font-size="19" font-weight="700" fill="#242424" >100 ns</text><rect x="230" y="164" width="85.81794417601219" height="30" fill="#d6d6d6" stroke="#262626" stroke-width="2"/><text x="305.8179441760122" y="185" font-size="15" font-weight="700" fill="#242424" text-anchor="end">10 m</text><text x="1040" y="185" font-size="15" font-weight="700" fill="#242424" >15 m</text><path d="M65 212 L1180 212" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="256" font-size="19" font-weight="700" fill="#242424" >1 µs</text><rect x="230" y="234" width="363.0986318433477" height="30" fill="#d6d6d6" stroke="#262626" stroke-width="2"/><text x="583.0986318433477" y="255" font-size="15" font-weight="700" fill="#242424" text-anchor="end">102 m</text><text x="1040" y="255" font-size="15" font-weight="700" fill="#242424" >150 m</text><path d="M65 282 L1180 282" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="326" font-size="19" font-weight="700" fill="#242424" >3 µs</text><rect x="230" y="304" width="495.33886393416947" height="30" fill="#d6d6d6" stroke="#262626" stroke-width="2"/><text x="715.3388639341695" y="325" font-size="15" font-weight="700" fill="#242424" text-anchor="end">306 m</text><text x="1040" y="325" font-size="15" font-weight="700" fill="#242424" >500 m</text><path d="M65 352 L1180 352" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="396" font-size="19" font-weight="700" fill="#242424" >10 µs</text><rect x="230" y="374" width="640.2731561442657" height="30" fill="#d6d6d6" stroke="#262626" stroke-width="2"/><text x="860.2731561442657" y="395" font-size="15" font-weight="700" fill="#242424" text-anchor="end">1,021 m</text><text x="1040" y="395" font-size="15" font-weight="700" fill="#242424" >2,200 m</text><path d="M65 422 L1180 422" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="466" font-size="19" font-weight="700" fill="#242424" >20 µs</text><rect x="230" y="444" width="723.7074531895604" height="30" fill="#d6d6d6" stroke="#262626" stroke-width="2"/><text x="943.7074531895604" y="465" font-size="15" font-weight="700" fill="#242424" text-anchor="end">2,042 m</text><text x="1040" y="465" font-size="15" font-weight="700" fill="#242424" >2,200 m</text><path d="M65 492 L1180 492" stroke="#d0cfc9" stroke-width="1" fill="none"/><path d="M313.43429704529456 494 L313.43429704529456 502" stroke="#6a6a6a" stroke-width="1.4" fill="none"/><text x="313.43429704529456" y="518" font-size="12" font-weight="700" fill="#6a6a6a" text-anchor="middle">10</text><path d="M590.5970324772363 494 L590.5970324772363 502" stroke="#6a6a6a" stroke-width="1.4" fill="none"/><text x="590.5970324772363" y="518" font-size="12" font-weight="700" fill="#6a6a6a" text-anchor="middle">100</text><path d="M867.7597679091781 494 L867.7597679091781 502" stroke="#6a6a6a" stroke-width="1.4" fill="none"/><text x="867.7597679091781" y="518" font-size="12" font-weight="700" fill="#6a6a6a" text-anchor="middle">1000</text><text x="230" y="538" font-size="12" font-weight="400" fill="#6a6a6a" >Distance (m, log axis)</text><text x="65" y="568" font-size="12.4" font-weight="700" fill="#242424" >EXFO rule: the launch cable must be longer than the pulse dead zone. The 306 m of 3 µs is longer than a 300 m product and shorter than a 500 m product.</text><text x="65" y="590" font-size="12.4" font-weight="400" fill="#6a6a6a" >A 15 m product against the 10 m of 100 ns leaves only a few meters, so check it against the document's few meters.</text></g></svg>