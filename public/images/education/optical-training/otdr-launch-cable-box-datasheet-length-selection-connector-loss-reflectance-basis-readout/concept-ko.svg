<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="34" font-weight="700" fill="#242424" >런치 케이블 박스 사양서를 읽는 순서</text><text x="65" y="116" font-size="19" font-weight="400" fill="#6a6a6a" >제조사·유통사 사양서 12건과 FOA 자료 2건 기준 · 개념도</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">길이</text><text x="210" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">펄스 폭이 차지하는 거리</text><text x="210" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">그보다 긴 제품을 고릅니다</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">손실 줄 기준</text><text x="600" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">최대 · 일반 · 반복성</text><text x="600" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">같은 기준끼리만 더합니다</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">종류·단자</text><text x="990" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">광섬유 · 입력 · 출력</text><text x="990" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">시험 대상에 맞춥니다</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="15" font-weight="700" fill="#242424" text-anchor="middle">반사 줄은 음수 반사율인지 양수 반사 감쇠량인지, 부등호가 어느 쪽인지, UPC와 APC 가운데 무엇인지 같이 옮깁니다</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">시험 전: 박스 커넥터의 단면을 검사하고 닦은 뒤 OTDR 포트와 선로 쪽 단자를 각각 확인합니다</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">기록: 문서 코드·판·날짜 · 펄스 폭과 계산한 거리 · 손실 줄의 기준</text><text x="600" y="584" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">반사 줄의 부호와 부등호 · 광섬유 종류와 리드 길이</text><text x="65" y="645" font-size="22" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>