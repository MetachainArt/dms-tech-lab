<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="34" font-weight="700" fill="#242424" >고정 광 감쇠기 사양서를 읽는 순서</text><text x="65" y="116" font-size="19" font-weight="400" fill="#6a6a6a" >제조사 사양서 11건과 FOA 해설 기준 · 개념도</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">허용 오차</text><text x="210" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">±dB · 퍼센트 · 부품별</text><text x="210" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">구간과 기준을 먼저 적습니다</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">포함 범위</text><text x="600" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">커넥터 손실 · 온도 · 파장</text><text x="600" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">문서에 없으면 미확인으로 둡니다</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">파장·반사</text><text x="990" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">PON 1310·1490·1577 nm</text><text x="990" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">UPC·APC 반사 감쇠량</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="16" font-weight="700" fill="#242424" text-anchor="middle">최악 감쇠량 = 감쇠값 − 허용 오차, 과부하 확인은 이 값으로 계산합니다</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">하향과 상향을 모두 계산합니다: 감쇠기 하나가 양방향 신호를 함께 줄입니다</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">기록: 문서 코드·개정·날짜 · 허용 오차 줄 전체 · 포함 범위</text><text x="600" y="584" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">파장 창과 반사 감쇠량 · 설치 뒤 광파워미터 측정</text><text x="65" y="645" font-size="22" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>