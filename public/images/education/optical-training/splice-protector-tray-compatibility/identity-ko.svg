<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#737373"/></marker></defs><rect width="1440" height="760" fill="#faf9f6"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="65" y="65" font-size="19" fill="#737373" font-weight="400">DMS / COMPONENT IDENTITY</text><text x="65" y="130" font-size="44" fill="#303030" font-weight="700">세 부품, 서로 다른 확인 항목</text><path d="M65 215h400" stroke="#a0a0a0"/><text x="65" y="275" font-size="30" fill="#303030" font-weight="700">트레이 키트</text><text x="65" y="345" font-size="24" fill="#303030" font-weight="400">정확한 키트 품번</text><text x="65" y="395" font-size="23" fill="#303030" font-weight="400">적용 함체 · 판본</text><path d="M430 290L495 290" stroke="#737373" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M520 215h400" stroke="#a0a0a0"/><text x="520" y="275" font-size="30" fill="#303030" font-weight="700">접속 모듈</text><text x="520" y="345" font-size="24" fill="#303030" font-weight="400">종류 · 개수</text><text x="520" y="395" font-size="23" fill="#303030" font-weight="400">접속 방식 · 수용량</text><path d="M885 290L950 290" stroke="#737373" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M975 215h400" stroke="#a0a0a0"/><text x="975" y="275" font-size="30" fill="#303030" font-weight="700">보호슬리브</text><text x="975" y="345" font-size="24" fill="#303030" font-weight="400">접미사 포함 품번</text><text x="975" y="395" font-size="23" fill="#303030" font-weight="400">단심 / 리본 · 치수 대상</text><path d="M265 440L265 500" stroke="#737373" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M720 440L720 500" stroke="#737373" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1175 440L1175 500" stroke="#737373" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M265 500H1175" stroke="#737373" fill="none"/><text x="230" y="575" font-size="28" fill="#303030" font-weight="700">문서의 조합 지정 + 수량·각주 대조 → 미확인 조합은 보류</text><text x="65" y="690" font-size="20" fill="#737373" font-weight="400">설명용 개념도 · 실제 제품 형상·조립 치수 아님</text></g></svg>