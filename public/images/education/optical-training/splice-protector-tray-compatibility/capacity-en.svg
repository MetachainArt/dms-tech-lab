<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#737373"/></marker></defs><rect width="1440" height="760" fill="#faf9f6"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="65" y="65" font-size="19" fill="#737373" font-weight="400">DMS / COUNTING UNITS</text><text x="65" y="130" font-size="43" fill="#303030" font-weight="700">Splice positions are not always fiber counts</text><path d="M65 190H1370M65 420H1370" stroke="#aaa"/><text x="65" y="250" font-size="26" fill="#303030" font-weight="700">SINGLE FIBER · SS144-S45</text><text x="65" y="330" font-size="60" fill="#303030" font-weight="700">6 × 24 = 144</text><text x="710" y="305" font-size="29" fill="#303030" font-weight="400">6 modules × 24 splices per module</text><text x="710" y="365" font-size="29" fill="#303030" font-weight="400">144 splices = 144 fibers</text><text x="65" y="480" font-size="26" fill="#303030" font-weight="700">12-FIBER RIBBON · RIBN-24</text><text x="65" y="565" font-size="60" fill="#303030" font-weight="700">24 × 12 = 288</text><text x="710" y="540" font-size="28" fill="#303030" font-weight="400">24 ribbon splices × 12 fibers per splice</text><text x="710" y="600" font-size="29" fill="#303030" font-weight="700">24 splices ≠ 288 slots</text><text x="65" y="710" font-size="20" fill="#737373" font-weight="400">Conditional document examples; kit application and slack storage still require checks</text></g></svg>