<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#737373"/></marker></defs><rect width="1440" height="760" fill="#faf9f6"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="65" y="65" font-size="19" fill="#737373" font-weight="400">DMS / COUNTING UNITS</text><text x="65" y="130" font-size="43" fill="#303030" font-weight="700">접속 위치와 광섬유 수의 구분</text><path d="M65 190H1370M65 420H1370" stroke="#aaa"/><text x="65" y="250" font-size="26" fill="#303030" font-weight="700">단심 · SS144-S45</text><text x="65" y="330" font-size="60" fill="#303030" font-weight="700">6 × 24 = 144</text><text x="710" y="305" font-size="29" fill="#303030" font-weight="400">모듈 6개 × 모듈당 접속 24개</text><text x="710" y="365" font-size="29" fill="#303030" font-weight="400">144개 접속 = 144심</text><text x="65" y="480" font-size="26" fill="#303030" font-weight="700">12심 리본 · RIBN-24</text><text x="65" y="565" font-size="60" fill="#303030" font-weight="700">24 × 12 = 288</text><text x="710" y="540" font-size="28" fill="#303030" font-weight="400">접속 24개 × 접속당 광섬유 12심</text><text x="710" y="600" font-size="29" fill="#303030" font-weight="700">24개 접속 ≠ 288개 슬롯</text><text x="65" y="710" font-size="20" fill="#737373" font-weight="400">문서 예시의 조건부 계산 · 키트 적용·여장 수납은 별도 확인</text></g></svg>