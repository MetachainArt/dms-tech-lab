<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="29" font-weight="700" fill="#242424" >Order for reading a fire rating label</text><text x="65" y="116" font-size="19" font-weight="400" fill="#6a6a6a" >Based on thirteen documents from Panduit, Corning, CommScope, AFL, Prysmian, HUBER+SUHNER and others · concept diagram</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="23" font-weight="700" fill="#242424" text-anchor="middle">System</text><text x="210" y="288" font-size="13.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">listing, CPR, IEC, material</text><text x="210" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">copy each on its own</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="23" font-weight="700" fill="#242424" text-anchor="middle">CPR code</text><text x="600" y="288" font-size="13.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">main class, s, d, a</text><text x="600" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">split down to the suffixes</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="23" font-weight="700" fill="#242424" text-anchor="middle">Row per fiber count</text><text x="990" y="288" font-size="13.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">row, not family name</text><text x="990" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">copy per range and construction</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="12.6" font-weight="700" fill="#242424" text-anchor="middle">Do not read OFNR or OFNP as a CPR class, and write flame retardant wording alone as row missing</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="13.2" font-weight="700" fill="#242424" text-anchor="middle">Put each item against the requirement, and write cannot be judged where a row is missing</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="13.2" font-weight="700" fill="#242424" text-anchor="middle">Record: document code, edition, date, which system, row per fiber count</text><text x="600" y="584" font-size="13.2" font-weight="700" fill="#242424" text-anchor="middle">all suffixes, test number category, disagreeing labels as two values</text><text x="65" y="645" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>