<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="34" font-weight="700" fill="#242424" >리본 케이블 사양서를 읽는 순서</text><text x="65" y="116" font-size="22" font-weight="400" fill="#6a6a6a" >Fujikura, AFL, Lightera, Panduit, Sumitomo Electric 문서 8건 기준 · 개념도</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">인장하중</text><text x="210" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">섬유 수 구간 · 병합 셀</text><text x="210" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">단기 · 장기의 이름과 단위</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">굽힘 반경</text><text x="600" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">mm 또는 지름 배수</text><text x="600" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">지름을 곱해 mm로 비교</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">설치 온도</text><text x="990" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">줄의 적용 범위</text><text x="990" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">섬유 수·구조 조건 확인</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="16" font-weight="700" fill="#242424" text-anchor="middle">같은 섬유 수를 문서별로 한 줄씩 나란히 놓습니다</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247