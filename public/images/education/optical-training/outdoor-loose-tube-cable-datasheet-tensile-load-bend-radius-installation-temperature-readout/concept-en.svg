<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="29" font-weight="700" fill="#242424" >Order for reading tensile, bend radius and temperature lines</text><text x="65" y="116" font-size="19" font-weight="400" fill="#6a6a6a" >Based on Corning, OCC, Molex, Belden, RDM, AFL, Link and Panduit documents · concept diagram</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="23" font-weight="700" fill="#242424" text-anchor="middle">Tensile load</text><text x="210" y="288" font-size="13.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">short term install, long term installed</text><text x="210" y="312" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">peak tension meter reading, load that stays</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="23" font-weight="700" fill="#242424" text-anchor="middle">Bend radius</text><text x="600" y="288" font-size="13.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">under load, without load</text><text x="600" y="312" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">convert to times diameter, check cm and in</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="23" font-weight="700" fill="#242424" text-anchor="middle">Temperature</text><text x="990" y="288" font-size="13.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">install, operate, storage</text><text x="990" y="312" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">is it the actual cable temperature</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="13.4" font-weight="700" fill="#242424" text-anchor="middle">Example: Corning PGS067 revision 7 · install 2,700 N, long term 890 N · bend 15x and 10x · install -30 to +70 °C</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="13.4" font-weight="700" fill="#242424" text-anchor="middle">When numbers or units disagree inside one document, record both values and do not choose one</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="13.4" font-weight="700" fill="#242424" text-anchor="middle">Record: document number and page, install line and long term line, multiple of diameter</text><text x="600" y="584" font-size="13.4" font-weight="700" fill="#242424" text-anchor="middle">whether the pass criterion is a number or only a standard name</text><text x="65" y="645" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>