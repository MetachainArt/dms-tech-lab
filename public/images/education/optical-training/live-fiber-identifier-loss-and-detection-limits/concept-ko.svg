<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="36" font-weight="700" fill="#242424" >식별기는 구부린 곳에서 샌 빛을 읽는다</text><text x="65" y="116" font-size="23" font-weight="400" fill="#242424" >제조사 자료 기준 · 개념도</text><path d="M65 440 L305 440 C365 440 375 360 435 360 C495 360 505 440 565 440 L700 440" stroke="#262626" stroke-width="3.5" fill="none"/><rect x="375" y="190" width="120" height="56" fill="none" stroke="#262626" stroke-width="2.5"/><text x="435" y="225" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">검출기</text><path d="M405 352 L405 252" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6 6" fill="none"/><path d="M435 352 L435 252" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6 6" fill="none"/><path d="M465 352 L465 252" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6 6" fill="none"/><text x="520" y="310" font-size="21" font-weight="400" fill="#6a6a6a" >샌 빛</text><path d="M110 480 L220 480" stroke="#262626" stroke-width="2" fill="none"/><path d="M208 472 L220 480 L208 488" stroke="#262626" stroke-width="2" fill="none"/><text x="110" y="510" font-size="21" font-weight="400" fill="#242424" >신호 방향</text><text x="300" y="480" font-size="21" font-weight="400" fill="#6a6a6a" >광섬유</text><rect x="740" y="170" width="395" height="330" fill="none" stroke="#262626" stroke-width="2"/><text x="765" y="215" font-size="27" font-weight="700" fill="#242424" >식별기가 알려 주는 것</text><text x="765" y="270" font-size="22" font-weight="400" fill="#242424" >활선 여부</text><path d="M765 286 L1110 286" stroke="#aaa" stroke-width="1"/><text x="765" y="325" font-size="22" font-weight="400" fill="#242424" >신호 방향</text><path d="M765 341 L1110 341" stroke="#aaa" stroke-width="1"/><text x="765" y="380" font-size="22" font-weight="400" fill="#242424" >톤 270 Hz · 1 kHz · 2 kHz</text><path d="M765 396 L1110 396" stroke="#aaa" stroke-width="1"/><text x="765" y="435" font-size="22" font-weight="400" fill="#242424" >광섬유 안 전력(일부 장비)</text><path d="M765 451 L1110 451" stroke="#aaa" stroke-width="1"/><text x="65" y="610" font-size="34" font-weight="700" fill="#242424" >신호 없음 ≠ 비활선의 증거</text></g></svg>