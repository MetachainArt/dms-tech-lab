<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="30" font-weight="700" fill="#242424" >Order for reading a fiber count line</text><text x="65" y="116" font-size="21" font-weight="400" fill="#6a6a6a" >Based on eight Panduit, Corning, Leviton, FS and Hexatronic documents · concept diagram</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Slots</text><text x="210" y="290" font-size="14.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">adapter panel or cassette positions</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="20" font-weight="700" fill="#242424" text-anchor="middle">Fibers per panel</text><text x="600" y="290" font-size="14.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">12 duplex LC panel = 24 fibers</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Printed fiber count</text><text x="990" y="290" font-size="14.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">compare with the printed value</text><text x="404" y="228" font-size="40" font-weight="700" fill="#242424" text-anchor="middle">×</text><text x="794" y="228" font-size="40" font-weight="700" fill="#242424" text-anchor="middle">=</text><rect x="65" y="330" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="368" font-size="14" font-weight="700" fill="#242424" text-anchor="middle">Example: 4 x 24 = 96 (Panduit FCE1U, 12 duplex LC panels) · a different slot count or panel type changes the number</text><path d="M600 300 L600 328" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 318.0950818741206 L600 328 L604.7846208752235 318.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 392 L600 424" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 414.0950818741206 L600 424 L604.7846208752235 414.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="426" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="464" font-size="14" font-weight="700" fill="#242424" text-anchor="middle">Splice capacity is its own line: with a tray count but no fibers per tray, do not convert</text><path d="M600 488 L600 520" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 510.0950818741206 L600 520 L604.7846208752235 510.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="522" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="552" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">Record: document number and date, slot count, panel type, unit (port, fiber, connector)</text><text x="600" y="578" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">splice capacity in its own cell, disagreeing lines as both values</text><text x="65" y="645" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>