<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="34" font-weight="700" fill="#242424" >섬유 수 줄을 읽는 순서</text><text x="65" y="116" font-size="22" font-weight="400" fill="#6a6a6a" >Panduit, Corning, Leviton, FS, Hexatronic 문서 여덟 건 기준 · 개념도</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="24" font-weight="700" fill="#242424" text-anchor="middle">칸 수</text><text x="210" y="290" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">어댑터 패널·카세트 자리</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="24" font-weight="700" fill="#242424" text-anchor="middle">패널당 섬유 수</text><text x="600" y="290" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">12 이중 LC 패널 24심</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="24" font-weight="700" fill="#242424" text-anchor="middle">적힌 섬유 수</text><text x="990" y="290" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">사양서가 적은 값과 대조</text><text x="404" y="228" font-size="40" font-weight="700" fill="#242424" text-anchor="middle">×</text><text x="794" y="228" font-size="40" font-weight="700" fill="#242424" text-anchor="middle">=</text><rect x="65" y="330" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="368" font-size="16.5" font-weight="700" fill="#242424" text-anchor="middle">예: 4 × 24 = 96 (Panduit FCE1U, 12 이중 LC 패널) · 칸 수와 패널 종류가 바뀌면 숫자가 바뀝니다</text><path d="M600 300 L600 328" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 318.0950818741206 L600 328 L604.7846208752235 318.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 392 L600 424" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 414.0950818741206 L600 424 L604.7846208752235 414.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="426" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="464" font-size="16.5" font-weight="700" fill="#242424" text-anchor="middle">융착 용량은 별도 줄: 트레이 수만 있고 트레이당 심선 수가 없으면 환산하지 않습니다</text><path d="M600 488 L600 520" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 510.0950818741206 L600 520 L604.7846208752235 510.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="522" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="552" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">기록: 문서 번호와 날짜 · 칸 수 · 패널 종류 · 단위(포트·섬유·커넥터)</text><text x="600" y="578" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">융착 용량은 별도 칸 · 안 맞는 줄은 두 값 그대로</text><text x="65" y="645" font-size="22" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>