<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="30" font-weight="700" fill="#242424" >Check order starting from a large cleave angle warning</text><text x="65" y="116" font-size="23" font-weight="400" fill="#6a6a6a" >Based on a standard and manufacturer documents · concept diagram</text><rect x="65" y="170" width="1070" height="64" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="212" font-size="28" font-weight="700" fill="#242424" text-anchor="middle">Large angle warning</text><path d="M600 234 L600 282" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 272.0950818741206 L600 282 L604.7846208752235 272.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="300" width="170" height="210" fill="none" stroke="#262626" stroke-width="3"/><text x="150" y="345" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">1 Clean</text><text x="150" y="400" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">Pads, anvil, blade</text><text x="150" y="428" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">Do not touch edge</text><path d="M235 405 L290 405" stroke="#262626" stroke-width="2" fill="none"/><path d="M280.0950818741206 409.78462087522354 L290 405 L280.0950818741206 400.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="290" y="300" width="170" height="210" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="375" y="345" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">2 Check</text><text x="375" y="400" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">Cleave a few,</text><text x="375" y="428" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">check angle, chip, lip</text><path d="M460 405 L515 405" stroke="#262626" stroke-width="2" fill="none"/><path d="M505.0950818741206 409.78462087522354 L515 405 L505.0950818741206 400.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="515" y="300" width="170" height="210" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="345" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">3 Rotate</text><text x="600" y="400" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">If still bad,</text><text x="600" y="428" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">blade position</text><path d="M685 405 L740 405" stroke="#262626" stroke-width="2" fill="none"/><path d="M730.0950818741205 409.78462087522354 L740 405 L730.0950818741205 400.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="740" y="300" width="170" height="210" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="825" y="345" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">4 Adjust height</text><text x="825" y="400" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">If still bad,</text><text x="825" y="428" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">check rattle and rubber</text><path d="M910 405 L965 405" stroke="#262626" stroke-width="2" fill="none"/><path d="M955.0950818741205 409.78462087522354 L965 405 L955.0950818741205 400.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="965" y="300" width="170" height="210" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="1050" y="345" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">5 Record</text><text x="1050" y="400" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">Actions and results</text><text x="1050" y="428" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">incl. replacements</text><text x="65" y="590" font-size="21" font-weight="400" fill="#242424" >Directions and scales: follow the maker manual</text><text x="65" y="640" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>