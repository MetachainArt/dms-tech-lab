<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="70" font-size="30" font-weight="700" fill="#242424" >Cleave angle criteria by document</text><text x="65" y="105" font-size="22" font-weight="400" fill="#6a6a6a" >Scopes differ, so this is not a like-for-like comparison</text><text x="65" y="196" font-size="20" font-weight="700" fill="#242424" >ITU-T L.12 · single fiber</text><rect x="520" y="160" width="118" height="52" fill="#555555" stroke="#262626" stroke-width="1.5"/><text x="650" y="197" font-size="22" font-weight="700" fill="#242424" >under 1°</text><text x="65" y="284" font-size="20" font-weight="700" fill="#242424" >STL · acceptable limit</text><rect x="520" y="248" width="236" height="52" fill="#555555" stroke="#262626" stroke-width="1.5"/><text x="768" y="285" font-size="22" font-weight="700" fill="#242424" >under 2°</text><text x="65" y="372" font-size="20" font-weight="700" fill="#242424" >STL · well-kept cleaver, typical</text><rect x="520" y="336" width="59" height="52" fill="#9a9a9a" stroke="#262626" stroke-width="1.5"/><text x="591" y="373" font-size="22" font-weight="700" fill="#242424" >about 0.5°</text><text x="65" y="460" font-size="20" font-weight="700" fill="#242424" >Greenlee 910CL · that equipment</text><rect x="520" y="424" width="59" height="52" fill="#242424" stroke="#262626" stroke-width="1.5"/><text x="591" y="461" font-size="22" font-weight="700" fill="#242424" >0.5° or less</text><text x="65" y="548" font-size="20" font-weight="700" fill="#242424" >ITU-T L.12 · ribbon</text><rect x="520" y="512" width="472" height="52" fill="#9a9a9a" stroke="#262626" stroke-width="1.5"/><text x="1004" y="549" font-size="22" font-weight="700" fill="#242424" >under 3–4°</text><path d="M520 150 L520 610" stroke="#262626" stroke-width="1.6"/><text x="520" y="632" font-size="18" font-weight="400" fill="#6a6a6a" text-anchor="middle">0</text><text x="638" y="632" font-size="18" font-weight="400" fill="#6a6a6a" text-anchor="middle">1</text><text x="756" y="632" font-size="18" font-weight="400" fill="#6a6a6a" text-anchor="middle">2</text><text x="874" y="632" font-size="18" font-weight="400" fill="#6a6a6a" text-anchor="middle">3</text><text x="992" y="632" font-size="18" font-weight="400" fill="#6a6a6a" text-anchor="middle">4</text><text x="820" y="658" font-size="18" font-weight="400" fill="#6a6a6a" >Angle limit (degrees)</text><text x="65" y="650" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>