<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Five steps to hand over evidence"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#555" stroke-width="1"/></marker><marker id="left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1L1 4L7 7" fill="none" stroke="#555" stroke-width="1"/></marker></defs><rect width="1280" height="720" fill="#f5f4f0"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="75" y="70" font-size="18" font-weight="500" fill="#252525">DMS / INSPECTION EVIDENCE</text><text x="75" y="133" font-size="38" font-weight="600" fill="#252525">Five steps to hand over evidence</text><text x="75" y="179" font-size="24" font-weight="400" fill="#252525">Identity, limit and a readable file, not just a pass icon</text><text x="75" y="280" font-size="48" font-weight="500" fill="#252525">01</text><text x="75" y="356" font-size="25" font-weight="600" fill="#252525">Identify</text><text x="75" y="405" font-size="21" font-weight="400" fill="#252525">Place / port / face</text><path d="M75 435H265" stroke="#aaa" stroke-width="1"/><path d="M225 270H281" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><text x="305" y="280" font-size="48" font-weight="500" fill="#252525">02</text><text x="305" y="356" font-size="25" font-weight="600" fill="#252525">Verify limit</text><text x="305" y="405" font-size="21" font-weight="400" fill="#252525">Document Only?</text><path d="M305 435H495" stroke="#aaa" stroke-width="1"/><path d="M455 270H511" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><text x="535" y="280" font-size="48" font-weight="500" fill="#252525">03</text><text x="535" y="356" font-size="25" font-weight="600" fill="#252525">Save result</text><text x="535" y="405" font-size="21" font-weight="400" fill="#252525">Image / time</text><path d="M535 435H725" stroke="#aaa" stroke-width="1"/><path d="M685 270H741" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><text x="765" y="280" font-size="48" font-weight="500" fill="#252525">04</text><text x="765" y="356" font-size="25" font-weight="600" fill="#252525">Review export</text><text x="765" y="405" font-size="21" font-weight="400" fill="#252525">Numbers / text</text><path d="M765 435H955" stroke="#aaa" stroke-width="1"/><path d="M915 270H971" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><text x="995" y="280" font-size="48" font-weight="500" fill="#252525">05</text><text x="995" y="356" font-size="25" font-weight="600" fill="#252525">Link records</text><text x="995" y="405" font-size="21" font-weight="400" fill="#252525">Loss / history</text><path d="M995 435H1185" stroke="#aaa" stroke-width="1"/><text x="75" y="540" font-size="27" font-weight="500" fill="#252525">Judge endface inspection and optical test acceptance separately</text><text x="75" y="615" font-size="22" font-weight="400" fill="#252525">DMS teaching recommendation · not a standards requirement or app screen</text></g></svg>