<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="52" font-size="32" font-weight="700" fill="#242424" >0.3 dB 융착 판독에서 사양 오차의 크기</text><text x="65" y="80" font-size="13.5" font-weight="400" fill="#6a6a6a" >가상 계산 · 읽은 값 0.28 dB, 합부 기준 0.30 dB 초과 · 오차는 dB/dB 값에 0.3 dB를 곱하거나 문서의 바닥 값 사용</text><text x="65" y="147" font-size="17" font-weight="700" fill="#242424" >EXFO 720D·735D, Fluke (0.03 dB/dB)</text><rect x="465" y="125" width="39.60000000000002" height="30" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="565" y="147" font-size="17" font-weight="700" fill="#242424" >±0.009</text><text x="65" y="219" font-size="17" font-weight="700" fill="#242424" >VIAVI 100A/B (0.04 dB/dB)</text><rect x="465" y="197" width="52.799999999999955" height="30" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="565" y="219" font-size="17" font-weight="700" fill="#242424" >±0.012</text><text x="65" y="291" font-size="17" font-weight="700" fill="#242424" >EXFO 715D (0.05 dB/dB)</text><rect x="465" y="269" width="66" height="30" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="565" y="291" font-size="17" font-weight="700" fill="#242424" >±0.015</text><text x="65" y="363" font-size="17" font-weight="700" fill="#242424" >Yokogawa AQ7280 (1 dB 이하 ±0.05 dB)</text><rect x="465" y="341" width="220" height="30" fill="#8a8a8a" stroke="#262626" stroke-width="1.6"/><text x="695" y="363" font-size="17" font-weight="700" fill="#242424" >±0.05</text><text x="65" y="435" font-size="17" font-weight="700" fill="#242424" >Anritsu MT9085 (바닥 ±0.1 dB)</text><rect x="465" y="413" width="440" height="30" fill="#555555" stroke="#262626" stroke-width="1.6"/><text x="915" y="435" font-size="17" font-weight="700" fill="#242424" >±0.10</text><path d="M553 108 L553 473" stroke="#262626" stroke-width="2" stroke-dasharray="7 5" fill="none"/><text x="561" y="104" font-size="15" font-weight="700" fill="#242424" >한도와 읽은 값의 차이 0.02 dB</text><path d="M465 112 L465 473" stroke="#262626" stroke-width="1.6"/><path d="M465 473 L993 473" stroke="#262626" stroke-width="1.6"/><path d="M465 473 L465 481" stroke="#262626" stroke-width="1.4"/><text x="465" y="500" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.00</text><path d="M553 473 L553 481" stroke="#262626" stroke-width="1.4"/><text x="553" y="500" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.02</text><path d="M641 473 L641 481" stroke="#262626" stroke-width="1.4"/><text x="641" y="500" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.04</text><path d="M729 473 L729 481" stroke="#262626" stroke-width="1.4"/><text x="729" y="500" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.06</text><path d="M817 473 L817 481" stroke="#262626" stroke-width="1.4"/><text x="817" y="500" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.08</text><path d="M905 473 L905 481" stroke="#262626" stroke-width="1.4"/><text x="905" y="500" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.10</text><path d="M993 473 L993 481" stroke="#262626" stroke-width="1.4"/><text x="993" y="500" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.12</text><text x="729" y="523" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">오차 (±dB)</text><text x="65" y="655" font-size="15" font-weight="400" fill="#242424" >점선보다 긴 막대는 사양 오차가 한도까지의 여유보다 크다는 뜻이며, 이 경우 합격으로 확정하지 않습니다.</text></g></svg>