<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="34" font-weight="700" fill="#242424" >OTDR 손실 사양서와 설정을 읽는 순서</text><text x="65" y="116" font-size="23" font-weight="400" fill="#6a6a6a" >제조사 문서 기준 · 개념도</text><rect x="65" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="160" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">손실 정확도</text><text x="160" y="308" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">dB/dB · 바닥 오차</text><path d="M257 232 L277 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M267.0950818741206 236.78462087522354 L277 232 L267.0950818741206 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="279" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="374" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">검출 임계값</text><text x="374" y="308" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">표에 오르는 최소 크기</text><path d="M471 232 L491 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M481.0950818741206 236.78462087522354 L491 232 L481.0950818741206 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="493" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="588" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">합부 임계값</text><text x="588" y="308" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">경고 · 불합격, 기준 판본</text><path d="M685 232 L705 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M695.0950818741205 236.78462087522354 L705 232 L695.0950818741205 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="707" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="802" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">사양 오차</text><text x="802" y="308" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">값 곱하기 dB/dB</text><path d="M899 232 L919 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M909.0950818741205 236.78462087522354 L919 232 L909.0950818741205 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="921" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="1016" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">기록</text><text x="1016" y="308" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">값 · 임계값 · 판본</text><rect x="65" y="370" width="1070" height="66" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="412" font-size="20" font-weight="700" fill="#242424" text-anchor="middle">검출 임계값이 합부 임계값보다 높으면 중간 크기 이벤트는 표에 없을 수 있음</text><path d="M160 314 L160 368" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M155.21537912477646 358.0950818741206 L160 368 L164.78462087522354 358.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 436 L600 478" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 468.0950818741206 L600 478 L604.7846208752235 468.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="480" width="1070" height="66" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="522" font-size="19" font-weight="700" fill="#242424" text-anchor="middle">기록: 읽은 값 · 사양 오차 · 검출 임계값 · 합부 임계값 · 기준 이름과 판본</text><text x="65" y="645" font-size="22" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>