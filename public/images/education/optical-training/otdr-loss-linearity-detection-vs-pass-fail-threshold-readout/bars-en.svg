<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="52" font-size="28" font-weight="700" fill="#242424" >Size of the datasheet error at a 0.3 dB splice reading</text><text x="65" y="80" font-size="11.5" font-weight="400" fill="#6a6a6a" >Hypothetical calculation · reading 0.28 dB, pass/fail limit above 0.30 dB · error is the dB/dB value times 0.3 dB, or the floor value printed in the document</text><text x="65" y="147" font-size="15.5" font-weight="700" fill="#242424" >EXFO 720D, 735D, Fluke (0.03 dB/dB)</text><rect x="465" y="125" width="39.60000000000002" height="30" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="565" y="147" font-size="17" font-weight="700" fill="#242424" >±0.009</text><text x="65" y="219" font-size="15.5" font-weight="700" fill="#242424" >VIAVI 100A/B (0.04 dB/dB)</text><rect x="465" y="197" width="52.799999999999955" height="30" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="565" y="219" font-size="17" font-weight="700" fill="#242424" >±0.012</text><text x="65" y="291" font-size="15.5" font-weight="700" fill="#242424" >EXFO 715D (0.05 dB/dB)</text><rect x="465" y="269" width="66" height="30" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="565" y="291" font-size="17" font-weight="700" fill="#242424" >±0.015</text><text x="65" y="363" font-size="15.5" font-weight="700" fill="#242424" >Yokogawa AQ7280 (±0.05 dB up to 1 dB)</text><rect x="465" y="341" width="220" height="30" fill="#8a8a8a" stroke="#262626" stroke-width="1.6"/><text x="695" y="363" font-size="17" font-weight="700" fill="#242424" >±0.05</text><text x="65" y="435" font-size="15.5" font-weight="700" fill="#242424" >Anritsu MT9085 (floor ±0.1 dB)</text><rect x="465" y="413" width="440" height="30" fill="#555555" stroke="#262626" stroke-width="1.6"/><text x="915" y="435" font-size="17" font-weight="700" fill="#242424" >±0.10</text><path d="M553 108 L553 473" stroke="#262626" stroke-width="2" stroke-dasharray="7 5" fill="none"/><text x="561" y="104" font-size="14" font-weight="700" fill="#242424" >gap between limit and reading 0.02 dB</text><path d="M465 112 L465 473" stroke="#262626" stroke-width="1.6"/><path d="M465 473 L993 473" stroke="#262626" stroke-width="1.6"/><path d="M465 473 L465 481" stroke="#262626" stroke-width="1.4"/><text x="465" y="500" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.00</text><path d="M553 473 L553 481" stroke="#262626" stroke-width="1.4"/><text x="553" y="500" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.02</text><path d="M641 473 L641 481" stroke="#262626" stroke-width="1.4"/><text x="641" y="500" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.04</text><path d="M729 473 L729 481" stroke="#262626" stroke-width="1.4"/><text x="729" y="500" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.06</text><path d="M817 473 L817 481" stroke="#262626" stroke-width="1.4"/><text x="817" y="500" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.08</text><path d="M905 473 L905 481" stroke="#262626" stroke-width="1.4"/><text x="905" y="500" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.10</text><path d="M993 473 L993 481" stroke="#262626" stroke-width="1.4"/><text x="993" y="500" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.12</text><text x="729" y="523" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">error (±dB)</text><text x="65" y="655" font-size="13.5" font-weight="400" fill="#242424" >A bar longer than the dashed line means the datasheet error exceeds the margin to the limit, so a pass is not confirmed.</text></g></svg>