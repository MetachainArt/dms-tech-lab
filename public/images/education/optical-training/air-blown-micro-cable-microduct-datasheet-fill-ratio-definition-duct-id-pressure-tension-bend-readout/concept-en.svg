<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="29" font-weight="700" fill="#242424" >Order for reading micro cable blowing datasheets</text><text x="65" y="116" font-size="15.5" font-weight="400" fill="#6a6a6a" >Based on 17 documents from FOA, Nexans, STL, Dura-Line, Hexatronic, Prysmian, Emtelle, Optomer, Xcom and Belden · concept diagram</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Fill ratio formula</text><text x="210" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">diameter ratio, area ratio</text><text x="210" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">calculate both values</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Duct ID line</text><text x="600" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">as printed in the cable document</text><text x="600" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">write beside the guidance</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Object of the limit</text><text x="990" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">duct, cable, equipment</text><text x="990" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">write with the revision</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="12.2" font-weight="700" fill="#242424" text-anchor="middle">Calculate both d÷D and d²÷D², write which formula the limit was compared with, and do not judge a bare number such as 65% without a formula</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="12.8" font-weight="700" fill="#242424" text-anchor="middle">If the duct ID line of the datasheet exceeds a general guide limit, replace neither and write both values side by side</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="12.4" font-weight="700" fill="#242424" text-anchor="middle">Record: document code, revision, date, formula and both values, duct ID line name and value</text><text x="600" y="584" font-size="12.4" font-weight="700" fill="#242424" text-anchor="middle">pressure as duct rating, work setting or equipment value, bend static or dynamic, distance as test track, recommended or case</text><text x="65" y="645" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>