<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="46" font-size="23" font-weight="700" fill="#242424" >Recommended fill ratio ranges shown as diameter ratio (d÷D)</text><text x="65" y="70" font-size="11" font-weight="400" fill="#6a6a6a" >Dark bar is a range printed as a diameter ratio · light bar is an area ratio converted to a diameter ratio (DMS conversion) · not a ranking between documents</text><path d="M300 100 L300 560" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="300" y="92" font-size="14" font-weight="700" fill="#242424" text-anchor="middle">30%</text><path d="M400 100 L400 560" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="400" y="92" font-size="14" font-weight="700" fill="#242424" text-anchor="middle">40%</text><path d="M500 100 L500 560" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="500" y="92" font-size="14" font-weight="700" fill="#242424" text-anchor="middle">50%</text><path d="M600 100 L600 560" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="600" y="92" font-size="14" font-weight="700" fill="#242424" text-anchor="middle">60%</text><path d="M700 100 L700 560" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="700" y="92" font-size="14" font-weight="700" fill="#242424" text-anchor="middle">70%</text><path d="M800 100 L800 560" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="800" y="92" font-size="14" font-weight="700" fill="#242424" text-anchor="middle">80%</text><path d="M900 100 L900 560" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="900" y="92" font-size="14" font-weight="700" fill="#242424" text-anchor="middle">90%</text><text x="65" y="146" font-size="16" font-weight="700" fill="#242424" >FOA</text><rect x="500" y="122" width="200" height="30" fill="#8a8a8a" stroke="#262626" stroke-width="1.6"/><rect x="700" y="122" width="100" height="30" fill="#d6d6d6" stroke="#262626" stroke-width="1.6" stroke-dasharray="5 4"/><text x="925" y="143" font-size="14" font-weight="700" fill="#242424" >50–70 · max 80</text><path d="M65 170 L1180 170" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="218" font-size="16" font-weight="700" fill="#242424" >Dura-Line</text><rect x="500" y="194" width="250" height="30" fill="#8a8a8a" stroke="#262626" stroke-width="1.6"/><text x="925" y="215" font-size="14" font-weight="700" fill="#242424" >50–75</text><path d="M65 242 L1180 242" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="290" font-size="16" font-weight="700" fill="#242424" >STL note (b)</text><rect x="300" y="266" width="500" height="30" fill="#8a8a8a" stroke="#262626" stroke-width="1.6"/><text x="925" y="287" font-size="14" font-weight="700" fill="#242424" >30–80</text><path d="M65 314 L1180 314" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="362" font-size="16" font-weight="700" fill="#242424" >STL note (a)</text><rect x="592" y="338" width="213.99999999999991" height="30" fill="#d6d6d6" stroke="#262626" stroke-width="1.6"/><text x="925" y="359" font-size="14" font-weight="700" fill="#242424" >35–65 (area)</text><path d="M65 386 L1180 386" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="434" font-size="16" font-weight="700" fill="#242424" >STL micro guide</text><rect x="775" y="410" width="62.00000000000003" height="30" fill="#d6d6d6" stroke="#262626" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M300 425 L775 425" stroke="#8a8a8a" stroke-width="2.4" stroke-dasharray="3 5" fill="none"/><text x="925" y="431" font-size="14" font-weight="700" fill="#242424" >≤ 60–70 (area)</text><path d="M65 458 L1180 458" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="506" font-size="16" font-weight="700" fill="#242424" >Nexans</text><path d="M300 497 L806 497" stroke="#8a8a8a" stroke-width="2.4" stroke-dasharray="3 5" fill="none"/><path d="M806 480 L806 514" stroke="#262626" stroke-width="3.6" fill="none"/><text x="925" y="503" font-size="14" font-weight="700" fill="#242424" >&lt; 65 (area)</text><path d="M65 530 L1180 530" stroke="#d0cfc9" stroke-width="1" fill="none"/><path d="M838 100 L838 566" stroke="#262626" stroke-width="2" stroke-dasharray="7 5" fill="none"/><text x="846" y="584" font-size="14" font-weight="700" fill="#242424" text-anchor="start">Case 1 · 83.8%</text><path d="M670 100 L670 566" stroke="#262626" stroke-width="2" stroke-dasharray="7 5" fill="none"/><text x="662" y="584" font-size="14" font-weight="700" fill="#242424" text-anchor="end">Case 2 · 67.0%</text><text x="65" y="612" font-size="11.5" font-weight="400" fill="#242424" >Case 1: a hypothetical 6.7 mm cable in an 8 mm duct. Case 2: the same cable in a 10 mm duct.</text><text x="65" y="634" font-size="11.5" font-weight="400" fill="#242424" >A bare 65% is about 42% as an area ratio if it is a diameter ratio, and about 80.6% as a diameter ratio if it is an area ratio. Conversions are DMS calculations.</text><text x="65" y="656" font-size="11" font-weight="400" fill="#6a6a6a" >Belden about 50% is a large-duct statement and is excluded.</text></g></svg>