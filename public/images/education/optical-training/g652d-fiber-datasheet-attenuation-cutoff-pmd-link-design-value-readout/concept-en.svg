<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="30" font-weight="700" fill="#242424" >Order for reading an attenuation coefficient line</text><text x="65" y="116" font-size="23" font-weight="400" fill="#6a6a6a" >Based on ITU-T G.652 and eight manufacturer and distributor documents · concept diagram</text><rect x="65" y="190" width="240" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="185" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Subject</text><text x="185" y="308" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">fiber or cable</text><path d="M307 232 L339 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M329.0950818741206 236.78462087522354 L339 232 L329.0950818741206 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="341" y="190" width="240" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="461" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Wavelength</text><text x="461" y="308" font-size="14" font-weight="400" fill="#6a6a6a" text-anchor="middle">1310, 1550, 1625 nm</text><path d="M583 232 L615 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M605.0950818741205 236.78462087522354 L615 232 L605.0950818741205 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="617" y="190" width="240" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="737" y="240" font-size="20" font-weight="700" fill="#242424" text-anchor="middle">Max or typical</text><text x="737" y="308" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">never in one column</text><path d="M859 232 L891 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M881.0950818741205 236.78462087522354 L891 232 L881.0950818741205 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="893" y="190" width="240" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="1013" y="240" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Edition</text><text x="1013" y="308" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">number and issue date</text><rect x="65" y="370" width="1070" height="66" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="412" font-size="14.5" font-weight="700" fill="#242424" text-anchor="middle">Under one product name, another subject, coating or edition is another line; do not copy the lowest line as the headline figure</text><path d="M185 314 L185 368" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M180.21537912477646 358.0950818741206 L185 368 L189.78462087522354 358.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 436 L600 478" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 468.0950818741206 L600 478 L604.7846208752235 468.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="480" width="1070" height="66" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="522" font-size="14.5" font-weight="700" fill="#242424" text-anchor="middle">Record: subject, wavelength, max or typical, document number and edition; assumed splice and connector loss in separate cells</text><text x="65" y="645" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>