<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="52" font-size="28" font-weight="700" fill="#242424" >Maximum attenuation at 1550 nm: cable and fiber values</text><text x="65" y="80" font-size="12" font-weight="400" fill="#6a6a6a" >Dark bars are cable values, light bars are fiber values · maximum printed in each document · unit dB/km</text><rect x="760" y="98" width="22" height="14" fill="#555555" stroke="#262626" stroke-width="1.4"/><text x="790" y="110" font-size="15" font-weight="700" fill="#242424" >Cable value</text><rect x="940" y="98" width="22" height="14" fill="#d8d6cf" stroke="#262626" stroke-width="1.4"/><text x="970" y="110" font-size="15" font-weight="700" fill="#242424" >Fiber value</text><text x="65" y="164" font-size="15" font-weight="700" fill="#242424" >ITU-T G.652 cable limit (1530 to 1565 nm)</text><rect x="470" y="134" width="450" height="42" fill="#555555" stroke="#262626" stroke-width="1.6"/><text x="930" y="163" font-size="18" font-weight="700" fill="#242424" >0.30</text><text x="65" y="232" font-size="15" font-weight="700" fill="#242424" >Distributor loose tube cable maximum</text><rect x="470" y="202" width="360" height="42" fill="#555555" stroke="#262626" stroke-width="1.6"/><text x="840" y="231" font-size="18" font-weight="700" fill="#242424" >0.24</text><text x="65" y="300" font-size="15" font-weight="700" fill="#242424" >Prysmian cable sheet</text><rect x="470" y="270" width="330" height="42" fill="#555555" stroke="#262626" stroke-width="1.6"/><text x="810" y="299" font-size="18" font-weight="700" fill="#242424" >0.22</text><text x="65" y="368" font-size="15" font-weight="700" fill="#242424" >Prysmian 500 µm fiber sheet</text><rect x="470" y="338" width="375" height="42" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="855" y="367" font-size="18" font-weight="700" fill="#242424" >0.25</text><text x="65" y="436" font-size="15" font-weight="700" fill="#242424" >Prysmian fiber sheet (Aug 2024)</text><rect x="470" y="406" width="315" height="42" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="795" y="435" font-size="18" font-weight="700" fill="#242424" >0.21</text><text x="65" y="504" font-size="15" font-weight="700" fill="#242424" >Corning SMF-28 Ultra (Jul 2025)</text><rect x="470" y="474" width="270" height="42" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="750" y="503" font-size="18" font-weight="700" fill="#242424" >0.18</text><path d="M470 124 L470 536" stroke="#262626" stroke-width="1.6"/><path d="M470 536 L995 536" stroke="#262626" stroke-width="1.6"/><path d="M470 536 L470 544" stroke="#262626" stroke-width="1.4"/><text x="470" y="563" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.0</text><path d="M620 536 L620 544" stroke="#262626" stroke-width="1.4"/><text x="620" y="563" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.1</text><path d="M770 536 L770 544" stroke="#262626" stroke-width="1.4"/><text x="770" y="563" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.2</text><path d="M920 536 L920 544" stroke="#262626" stroke-width="1.4"/><text x="920" y="563" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.3</text><text x="695" y="586" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">dB/km</text><text x="65" y="662" font-size="13.5" font-weight="400" fill="#242424" >Cable and fiber values have different subjects, so this is not a like-for-like comparison. The gap between the limit and a sheet value does not state a design margin.</text></g></svg>