<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="52" font-size="32" font-weight="700" fill="#242424" >1550 nm 최대 감쇠 계수: 케이블 값과 섬유 값</text><text x="65" y="80" font-size="14" font-weight="400" fill="#6a6a6a" >짙은 막대는 케이블 값, 옅은 막대는 섬유 값 · 각 문서가 적은 최대값 · 단위 dB/km</text><rect x="760" y="98" width="22" height="14" fill="#555555" stroke="#262626" stroke-width="1.4"/><text x="790" y="110" font-size="15" font-weight="700" fill="#242424" >케이블 값</text><rect x="940" y="98" width="22" height="14" fill="#d8d6cf" stroke="#262626" stroke-width="1.4"/><text x="970" y="110" font-size="15" font-weight="700" fill="#242424" >섬유 값</text><text x="65" y="164" font-size="16" font-weight="700" fill="#242424" >ITU-T G.652 케이블 한도 (1530–1565 nm)</text><rect x="470" y="134" width="450" height="42" fill="#555555" stroke="#262626" stroke-width="1.6"/><text x="930" y="163" font-size="18" font-weight="700" fill="#242424" >0.30</text><text x="65" y="232" font-size="16" font-weight="700" fill="#242424" >유통사 느슨한 튜브 케이블 최대</text><rect x="470" y="202" width="360" height="42" fill="#555555" stroke="#262626" stroke-width="1.6"/><text x="840" y="231" font-size="18" font-weight="700" fill="#242424" >0.24</text><text x="65" y="300" font-size="16" font-weight="700" fill="#242424" >Prysmian 케이블 시트</text><rect x="470" y="270" width="330" height="42" fill="#555555" stroke="#262626" stroke-width="1.6"/><text x="810" y="299" font-size="18" font-weight="700" fill="#242424" >0.22</text><text x="65" y="368" font-size="16" font-weight="700" fill="#242424" >Prysmian 500 µm 섬유 시트</text><rect x="470" y="338" width="375" height="42" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="855" y="367" font-size="18" font-weight="700" fill="#242424" >0.25</text><text x="65" y="436" font-size="16" font-weight="700" fill="#242424" >Prysmian 섬유 시트 (2024년 8월)</text><rect x="470" y="406" width="315" height="42" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="795" y="435" font-size="18" font-weight="700" fill="#242424" >0.21</text><text x="65" y="504" font-size="16" font-weight="700" fill="#242424" >Corning SMF-28 Ultra (2025년 7월)</text><rect x="470" y="474" width="270" height="42" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="750" y="503" font-size="18" font-weight="700" fill="#242424" >0.18</text><path d="M470 124 L470 536" stroke="#262626" stroke-width="1.6"/><path d="M470 536 L995 536" stroke="#262626" stroke-width="1.6"/><path d="M470 536 L470 544" stroke="#262626" stroke-width="1.4"/><text x="470" y="563" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.0</text><path d="M620 536 L620 544" stroke="#262626" stroke-width="1.4"/><text x="620" y="563" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.1</text><path d="M770 536 L770 544" stroke="#262626" stroke-width="1.4"/><text x="770" y="563" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.2</text><path d="M920 536 L920 544" stroke="#262626" stroke-width="1.4"/><text x="920" y="563" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0.3</text><text x="695" y="586" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">dB/km</text><text x="65" y="662" font-size="15" font-weight="400" fill="#242424" >케이블 값과 섬유 값은 대상이 달라 같은 줄에서의 비교가 아닙니다. 기준 한도와 시트 값의 차이는 설계 여유의 크기를 뜻하지 않습니다.</text></g></svg>