<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f6f5f2"/><style>text{font-family:'Malgun Gothic',Arial,sans-serif;fill:#292929}.small{font-size:23px}.big{font-size:42px;font-weight:700}.muted{fill:#656565}</style><text x="70" y="80" class="big">Delta loss is not an acceptance verdict</text><text x="70" y="130" class="small muted">Fictional training example · same event and direction assumed</text><text x="85" y="245" class="small">1310 nm</text><text x="85" y="310" class="big">0.08 dB</text><text x="450" y="245" class="small">1550 nm</text><text x="450" y="310" class="big">0.42 dB</text><path d="M85 355H1090" stroke="#aaa"/><text x="85" y="440" class="big">ΔL = 0.42 − 0.08 = 0.34 dB</text><text x="85" y="510" class="small">Does not exceed the cited 0.5 dB default ≠ acceptable routing</text><text x="85" y="565" class="small muted">Verify actual detection settings and acceptance requirements separately</text></svg>