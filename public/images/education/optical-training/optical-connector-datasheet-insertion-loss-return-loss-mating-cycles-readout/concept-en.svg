<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="30" font-weight="700" fill="#242424" >Order for reading an insertion loss line</text><text x="65" y="116" font-size="21" font-weight="400" fill="#6a6a6a" >Based on nine Senko, Corning, Panduit, AFL and Fischer documents and ITU-T L.404 · concept diagram</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="21" font-weight="700" fill="#242424" text-anchor="middle">Kind of value</text><text x="210" y="290" font-size="14.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">typical, mean or maximum</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="21" font-weight="700" fill="#242424" text-anchor="middle">Partner connector</text><text x="600" y="290" font-size="14.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">master or random mating</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="21" font-weight="700" fill="#242424" text-anchor="middle">Printed loss</text><text x="990" y="290" font-size="14.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">the number and its note</text><text x="404" y="228" font-size="40" font-weight="700" fill="#242424" text-anchor="middle">×</text><text x="794" y="228" font-size="40" font-weight="700" fill="#242424" text-anchor="middle">=</text><rect x="65" y="330" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="368" font-size="13.2" font-weight="700" fill="#242424" text-anchor="middle">Example: Premium SM averages 0.08 dB against a master and 0.12 dB in random mating · the same connector changes number with the condition</text><path d="M600 300 L600 328" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 318.0950818741206 L600 328 L604.7846208752235 318.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 392 L600 424" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 414.0950818741206 L600 424 L604.7846208752235 414.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="426" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="464" font-size="13.2" font-weight="700" fill="#242424" text-anchor="middle">Mating cycles go with the allowed change: a count with no allowed change is a line whose pass criterion is unconfirmed</text><path d="M600 488 L600 520" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 510.0950818741206 L600 520 L604.7846208752235 510.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="522" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="552" font-size="13.5" font-weight="700" fill="#242424" text-anchor="middle">Record: document number and date, kind of value, partner condition</text><text x="600" y="578" font-size="13.5" font-weight="700" fill="#242424" text-anchor="middle">sign and state of the reflection line, table of the grade name</text><text x="65" y="645" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>