<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="34" font-weight="700" fill="#242424" >삽입손실 줄을 읽는 순서</text><text x="65" y="116" font-size="22" font-weight="400" fill="#6a6a6a" >Senko, Corning, Panduit, AFL, Fischer 문서 아홉 건과 ITU-T L.404 기준 · 개념도</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="24" font-weight="700" fill="#242424" text-anchor="middle">값의 종류</text><text x="210" y="290" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">대표값 · 평균값 · 최대값</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="24" font-weight="700" fill="#242424" text-anchor="middle">상대 커넥터</text><text x="600" y="290" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">기준품 또는 무작위 접속</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="24" font-weight="700" fill="#242424" text-anchor="middle">적힌 삽입손실</text><text x="990" y="290" font-size="16" font-weight="400" fill="#6a6a6a" text-anchor="middle">사양서가 적은 숫자와 주석</text><text x="404" y="228" font-size="40" font-weight="700" fill="#242424" text-anchor="middle">×</text><text x="794" y="228" font-size="40" font-weight="700" fill="#242424" text-anchor="middle">=</text><rect x="65" y="330" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="368" font-size="16" font-weight="700" fill="#242424" text-anchor="middle">예: Premium SM 기준품 대비 평균 0.08 dB, 무작위 접속 평균 0.12 dB · 같은 커넥터도 조건이 바뀌면 숫자가 바뀝니다</text><path d="M600 300 L600 328" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 318.0950818741206 L600 328 L604.7846208752235 318.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 392 L600 424" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 414.0950818741206 L600 424 L604.7846208752235 414.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="426" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="464" font-size="16.5" font-weight="700" fill="#242424" text-anchor="middle">착탈 횟수는 손실 변화 한도와 같이: 횟수만 있고 변화 한도가 없으면 합격 기준을 확인하지 못한 줄입니다</text><path d="M600 488 L600 520" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 510.0950818741206 L600 520 L604.7846208752235 510.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="522" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="552" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">기록: 문서 번호와 날짜 · 값의 종류 · 상대 커넥터 조건</text><text x="600" y="578" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">반사 줄의 부호와 상태 · 등급 이름이 속한 표</text><text x="65" y="645" font-size="22" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>