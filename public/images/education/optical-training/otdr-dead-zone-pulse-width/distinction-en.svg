<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f6f5f2"/><style>text{font-family:'Malgun Gothic',Arial,sans-serif;fill:#292929}.muted{fill:#686868}.small{font-size:22px}.label{font-size:30px}.big{font-size:50px;font-weight:700}</style><text x="64" y="57" class="small muted">DMS / OPTICAL TRAINING / 2026-10-18</text><text x="64" y="123" font-size="38" font-weight="700">Detection is not individual loss measurement</text><path d="M64 151H1136" stroke="#aaa"/><text x="64" y="215" class="big">EDZ</text><text x="420" y="207" class="label">Distinguish two reflective events</text><path d="M64 350H150L180 240L210 345H280L310 240L340 345H550" fill="none" stroke="#303030" stroke-width="3"/><text x="640" y="290" class="label">Two peaks are visible</text><text x="640" y="332" class="small muted">Individual loss still needs valid backscatter</text><path d="M64 394H1136" stroke="#bbb"/><text x="64" y="460" class="big">ADZ</text><text x="420" y="450" class="label">Measure a following event’s loss</text><text x="64" y="529" class="label">Recovered backscatter + valid analysis sections</text><text x="64" y="616" class="small muted">Concept only · not to scale · not a measured trace or product specification</text></svg>