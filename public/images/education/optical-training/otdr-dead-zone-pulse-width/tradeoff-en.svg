<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f6f5f2"/><style>text{font-family:'Malgun Gothic',Arial,sans-serif;fill:#292929}.muted{fill:#686868}.small{font-size:22px}.label{font-size:30px}.big{font-size:50px;font-weight:700}</style><text x="64" y="57" class="small muted">DMS / OPTICAL TRAINING / 2026-10-18</text><text x="64" y="123" font-size="38" font-weight="700">Pulse-width trade-off and separate records</text><path d="M64 151H1136" stroke="#aaa"/><text x="64" y="225" class="small muted">Conceptual comparison: same instrument, comparable conditions</text><text x="64" y="320" class="big">Short pulse</text><path d="M440 304H578M565 294L579 304L565 314" fill="none" stroke="#333" stroke-width="2"/><text x="630" y="294" class="label">Helps resolve nearby events</text><text x="630" y="339" class="small muted">Check for weak far-end backscatter</text><path d="M64 385H1136" stroke="#bbb"/><text x="64" y="468" class="big">Long pulse</text><path d="M440 452H578M565 442L579 452L565 462" fill="none" stroke="#333" stroke-width="2"/><text x="630" y="442" class="label">Helps provide reach</text><text x="630" y="487" class="small muted">Check merged events and longer recovery</text><text x="64" y="570" class="label">Short-pulse record + full-span record</text><text x="64" y="626" class="small muted">Averaging can reduce noise; it does not guarantee dead-zone removal</text></svg>