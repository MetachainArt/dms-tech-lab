<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#363636" stroke-width="1.2"/></marker></defs><rect width="1440" height="690" fill="#faf9f6"/><g font-family="Malgun Gothic, Arial, sans-serif" fill="#292929"><text x="70" y="65" font-size="37" font-weight="700">끝단 반사와 손실 분석 구간의 차이</text><text x="70" y="112" font-size="25">수신 광섬유 없음: 개방 끝, 접속 뒤 광섬유 구간 없음</text><path d="M120 145 V290 H1325" fill="none" stroke="#777" stroke-width="1.5"/><path d="M150 183 L840 205 L875 205 L882 150 L895 280" fill="none" stroke="#2c2c2c" stroke-width="3"/><path d="M895 280 L915 274 L935 284 L955 275 L980 282 L1000 278 L1030 286 L1060 279 L1090 283 L1140 276 L1180 285 L1250 278 L1300 285" fill="none" stroke="#999" stroke-width="2"/><text x="730" y="168" font-size="24">개방 끝</text><text x="1010" y="220" font-size="25" fill="#626262">잡음 ≠ 손실 비교 구간</text><text x="70" y="345" font-size="25">수신 광섬유 연결: C2 뒤 회복 구간 확인</text><path d="M120 375 V550 H1325" fill="none" stroke="#777" stroke-width="1.5"/><path d="M150 415 L840 437 L875 437 L882 385 Q886 462 980 470 L1200 479 L1215 420 L1230 542" fill="none" stroke="#2c2c2c" stroke-width="3"/><path d="M990 495 H1190" fill="none" stroke="#444" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="1015" y="530" font-size="24">회복된 분석 구간</text><text x="805" y="399" font-size="25">C2</text><text x="1200" y="395" font-size="23" text-anchor="middle">코드 끝</text><text x="122" y="592" font-size="23" fill="#626262">세로: 반환 신호 수준 · 가로: 거리 · 수치 축척 없음</text><text x="70" y="648" font-size="23" fill="#626262">교육용 설명 파형입니다. 실제 측정·합격 한계값·필수 코드 길이를 나타내지 않습니다.</text></g></svg>