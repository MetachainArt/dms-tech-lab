<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#363636" stroke-width="1.2"/></marker></defs><rect width="1440" height="650" fill="#faf9f6"/><g font-family="Malgun Gothic, Arial, sans-serif" fill="#292929"><text x="70" y="80" font-size="38" font-weight="700">관측 구간과 시험 링크 경계</text><text x="70" y="125" font-size="25" fill="#626262">길이 비례가 아닌 개념도입니다. C1·C2 = 맞물린 접속 쌍</text><rect x="65" y="225" width="95" height="80" rx="9" fill="#eceae5" stroke="#444" stroke-width="2"/><text x="112" y="275" text-anchor="middle" font-size="27">OTDR</text><path d="M160 265 H360 M360 265 H1040 M1040 265 H1360" fill="none" stroke="#444" stroke-width="3"/><path d="M180 247 H337 M386 247 H1016 M1062 247 H1328" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#a)"/><circle cx="360" cy="265" r="12" fill="#faf9f6" stroke="#222" stroke-width="3"/><circle cx="1040" cy="265" r="12" fill="#faf9f6" stroke="#222" stroke-width="3"/><text x="360" y="210" text-anchor="middle" font-size="32">C1</text><text x="1040" y="210" text-anchor="middle" font-size="32">C2</text><text x="260" y="355" text-anchor="middle" font-size="30">런치 광섬유</text><text x="700" y="355" text-anchor="middle" font-size="34" font-weight="700">시험 링크</text><text x="1205" y="355" text-anchor="middle" font-size="30">수신 광섬유</text><path d="M360 402 V430 H1040 V402" fill="none" stroke="#333" stroke-width="2"/><text x="700" y="475" text-anchor="middle" font-size="29">보고 범위: 시험 링크와 평가할 양 끝 접속</text><text x="70" y="572" font-size="25" fill="#626262">측정 코드는 연결한 상태로 유지합니다. 보고 경계는 별도로 확인합니다.</text></g></svg>