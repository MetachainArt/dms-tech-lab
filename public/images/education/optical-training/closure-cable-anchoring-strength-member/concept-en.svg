<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="30" font-weight="700" fill="#242424" >Retention and sealing are jobs for different parts</text><text x="65" y="116" font-size="23" font-weight="400" fill="#6a6a6a" >Based on manufacturer installation instructions · concept diagram</text><rect x="65" y="170" width="1070" height="64" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="212" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">Find the strength member reference point in the closure instruction</text><path d="M600 234 L600 282" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 272.0950818741206 L600 282 L604.7846208752235 272.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="300" width="170" height="210" fill="none" stroke="#262626" stroke-width="3"/><text x="150" y="345" font-size="20" font-weight="700" fill="#242424" text-anchor="middle">1 Terminate</text><text x="150" y="400" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">Member in bracket,</text><text x="150" y="428" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">length from reference</text><path d="M235 405 L290 405" stroke="#262626" stroke-width="2" fill="none"/><path d="M280.0950818741206 409.78462087522354 L290 405 L280.0950818741206 400.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="290" y="300" width="170" height="210" fill="none" stroke="#262626" stroke-width="3"/><text x="375" y="345" font-size="20" font-weight="700" fill="#242424" text-anchor="middle">2 Jacket clamp</text><text x="375" y="400" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">Teeth seated,</text><text x="375" y="428" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">no deformation</text><path d="M460 405 L515 405" stroke="#262626" stroke-width="2" fill="none"/><path d="M505.0950818741206 409.78462087522354 L515 405 L505.0950818741206 400.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="515" y="300" width="170" height="210" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="345" font-size="20" font-weight="700" fill="#242424" text-anchor="middle">3 Check by eye</text><text x="600" y="400" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">Photograph it,</text><text x="600" y="428" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">before sealing</text><path d="M685 405 L740 405" stroke="#262626" stroke-width="2" fill="none"/><path d="M730.0950818741205 409.78462087522354 L740 405 L730.0950818741205 400.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="740" y="300" width="170" height="210" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="825" y="345" font-size="20" font-weight="700" fill="#242424" text-anchor="middle">4 Seal</text><text x="825" y="400" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">Gel end-piece or</text><text x="825" y="428" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">gel block compression</text><path d="M910 405 L965 405" stroke="#262626" stroke-width="2" fill="none"/><path d="M955.0950818741205 409.78462087522354 L965 405 L955.0950818741205 400.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="965" y="300" width="170" height="210" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="1050" y="345" font-size="20" font-weight="700" fill="#242424" text-anchor="middle">5 Pressure test</text><text x="1050" y="400" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">5 psi soapy water,</text><text x="1050" y="428" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">bleed, then record</text><text x="65" y="545" font-size="19" font-weight="700" fill="#242424" >Retention</text><path d="M190 552 L685 552" stroke="#262626" stroke-width="2"/><text x="740" y="545" font-size="19" font-weight="700" fill="#6a6a6a" >Sealing</text><path d="M820 552 L1135 552" stroke="#8a8a8a" stroke-width="2"/><text x="65" y="596" font-size="21" font-weight="400" fill="#242424" >Record retention checks and the seal test separately</text><text x="65" y="645" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>