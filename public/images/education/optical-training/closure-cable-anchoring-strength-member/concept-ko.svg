<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="34" font-weight="700" fill="#242424" >케이블 고정과 밀봉은 서로 다른 부품의 일입니다</text><text x="65" y="116" font-size="23" font-weight="400" fill="#6a6a6a" >제조사 설치 지침 기준 · 개념도</text><rect x="65" y="170" width="1070" height="64" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="212" font-size="28" font-weight="700" fill="#242424" text-anchor="middle">쓰는 함체 지침에서 인장선 기준점을 확인</text><path d="M600 234 L600 282" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 272.0950818741206 L600 282 L604.7846208752235 272.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="300" width="170" height="210" fill="none" stroke="#262626" stroke-width="3"/><text x="150" y="345" font-size="24" font-weight="700" fill="#242424" text-anchor="middle">1 인장선 체결</text><text x="150" y="400" font-size="17" font-weight="400" fill="#6a6a6a" text-anchor="middle">브래킷에 물림</text><text x="150" y="428" font-size="17" font-weight="400" fill="#6a6a6a" text-anchor="middle">길이는 기준점부터</text><path d="M235 405 L290 405" stroke="#262626" stroke-width="2" fill="none"/><path d="M280.0950818741206 409.78462087522354 L290 405 L280.0950818741206 400.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="290" y="300" width="170" height="210" fill="none" stroke="#262626" stroke-width="3"/><text x="375" y="345" font-size="24" font-weight="700" fill="#242424" text-anchor="middle">2 재킷 클램프</text><text x="375" y="400" font-size="17" font-weight="400" fill="#6a6a6a" text-anchor="middle">이빨 안착</text><text x="375" y="428" font-size="17" font-weight="400" fill="#6a6a6a" text-anchor="middle">변형 없이 조임</text><path d="M460 405 L515 405" stroke="#262626" stroke-width="2" fill="none"/><path d="M505.0950818741206 409.78462087522354 L515 405 L505.0950818741206 400.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="515" y="300" width="170" height="210" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="345" font-size="24" font-weight="700" fill="#242424" text-anchor="middle">3 육안 확인</text><text x="600" y="400" font-size="17" font-weight="400" fill="#6a6a6a" text-anchor="middle">사진으로 남김</text><text x="600" y="428" font-size="17" font-weight="400" fill="#6a6a6a" text-anchor="middle">밀봉 전에 확인</text><path d="M685 405 L740 405" stroke="#262626" stroke-width="2" fill="none"/><path d="M730.0950818741205 409.78462087522354 L740 405 L730.0950818741205 400.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="740" y="300" width="170" height="210" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="825" y="345" font-size="24" font-weight="700" fill="#242424" text-anchor="middle">4 밀봉</text><text x="825" y="400" font-size="17" font-weight="400" fill="#6a6a6a" text-anchor="middle">젤 엔드피스 또는</text><text x="825" y="428" font-size="17" font-weight="400" fill="#6a6a6a" text-anchor="middle">젤 블록 압축</text><path d="M910 405 L965 405" stroke="#262626" stroke-width="2" fill="none"/><path d="M955.0950818741205 409.78462087522354 L965 405 L955.0950818741205 400.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="965" y="300" width="170" height="210" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="1050" y="345" font-size="24" font-weight="700" fill="#242424" text-anchor="middle">5 가압 시험</text><text x="1050" y="400" font-size="17" font-weight="400" fill="#6a6a6a" text-anchor="middle">5 psi 비눗물</text><text x="1050" y="428" font-size="17" font-weight="400" fill="#6a6a6a" text-anchor="middle">압력 빼고 기록</text><text x="65" y="545" font-size="19" font-weight="700" fill="#242424" >고정</text><path d="M130 552 L685 552" stroke="#262626" stroke-width="2"/><text x="740" y="545" font-size="19" font-weight="700" fill="#6a6a6a" >밀봉</text><path d="M820 552 L1135 552" stroke="#8a8a8a" stroke-width="2"/><text x="65" y="596" font-size="24" font-weight="400" fill="#242424" >고정 확인과 밀봉 시험은 기록에서 따로 적음</text><text x="65" y="645" font-size="22" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>