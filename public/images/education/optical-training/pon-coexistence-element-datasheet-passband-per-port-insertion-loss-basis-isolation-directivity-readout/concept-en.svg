<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="27" font-weight="700" fill="#242424" >Order for reading a coexistence element datasheet</text><text x="65" y="116" font-size="15.5" font-weight="400" fill="#6a6a6a" >Based on 13 manufacturer and distributor documents and an ITU-T G.9805 appendix · concept diagram</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="21" font-weight="700" fill="#242424" text-anchor="middle">Ports and bands</text><text x="210" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">configuration number, port names</text><text x="210" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">Check the passband edge values</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="21" font-weight="700" fill="#242424" text-anchor="middle">Loss basis</text><text x="600" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">connectors included or not</text><text x="600" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">Add only same-basis values to the budget</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="21" font-weight="700" fill="#242424" text-anchor="middle">Isolation</text><text x="990" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">port and use conditions</text><text x="990" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">Calculate the need from differential loss</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="12" font-weight="700" fill="#242424" text-anchor="middle">Unify the units and inequalities of directivity, return loss, PDL, PMD and power handling</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="12.2" font-weight="700" fill="#242424" text-anchor="middle">Before the test: check that the OTDR monitoring wavelength is inside the OTDR port passband and the power limit of that port</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="12.2" font-weight="700" fill="#242424" text-anchor="middle">Record: document code, edition, date, configuration number, port names, loss basis</text><text x="600" y="584" font-size="12.2" font-weight="700" fill="#242424" text-anchor="middle">isolation conditions and calculated need, units and inequalities, connector polish</text><text x="65" y="645" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>