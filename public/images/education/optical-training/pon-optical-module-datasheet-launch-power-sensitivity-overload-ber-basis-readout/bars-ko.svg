<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="42" font-size="27" font-weight="700" fill="#242424" >OLT와 ONU 수신 창: 표준과 제조사 사양서</text><text x="65" y="64" font-size="12" font-weight="400" fill="#6a6a6a" >막대의 왼쪽 끝은 감도, 오른쪽 끝은 과부하입니다 · 짙은 막대는 ITU-T G.984.2, 옅은 막대는 제조사 사양서 · 조건이 다른 막대는 순위가 아님</text><path d="M400 92 L400 546" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="400" y="86" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">-36</text><path d="M455.55555555555554 92 L455.55555555555554 546" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="455.55555555555554" y="86" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">-32</text><path d="M511.1111111111111 92 L511.1111111111111 546" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="511.1111111111111" y="86" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">-28</text><path d="M566.6666666666667 92 L566.6666666666667 546" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="566.6666666666667" y="86" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">-24</text><path d="M622.2222222222222 92 L622.2222222222222 546" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="622.2222222222222" y="86" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">-20</text><path d="M677.7777777777778 92 L677.7777777777778 546" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="677.7777777777778" y="86" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">-16</text><path d="M733.3333333333334 92 L733.3333333333334 546" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="733.3333333333334" y="86" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">-12</text><path d="M788.8888888888889 92 L788.8888888888889 546" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="788.8888888888889" y="86" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">-8</text><path d="M844.4444444444445 92 L844.4444444444445 546" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="844.4444444444445" y="86" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">-4</text><path d="M900 92 L900 546" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="900" y="86" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">0</text><text x="908" y="86" font-size="12" font-weight="400" fill="#6a6a6a" >dBm</text><rect x="747.2222222222222" y="96" width="55.55555555555566" height="135" fill="#262626" fill-opacity="0.13" stroke="#262626" stroke-width="1.4" stroke-dasharray="6 4"/><text x="65" y="126" font-size="15" font-weight="700" fill="#242424" >ONU B+ · G.984.2 부속서 A</text><rect x="525" y="104" width="263.8888888888889" height="28" fill="#8a8a8a" stroke="#262626" stroke-width="1.6"/><text x="531" y="123" font-size="12.5" font-weight="700" fill="#f4f3ef" >-27</text><text x="782.8888888888889" y="123" font-size="12.5" font-weight="700" fill="#f4f3ef" text-anchor="end">-8</text><text x="930" y="123" font-size="13" font-weight="400" fill="#242424" >설계 목표 10⁻¹⁰</text><path d="M65 140 L1180 140" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="171" font-size="15" font-weight="700" fill="#242424" >ONU B+ · C-Light</text><rect x="511.1111111111111" y="149" width="347.2222222222223" height="28" fill="#d6d6d6" stroke="#262626" stroke-width="1.6"/><text x="517.1111111111111" y="168" font-size="12.5" font-weight="700" fill="#242424" >-28</text><text x="852.3333333333334" y="168" font-size="12.5" font-weight="700" fill="#242424" text-anchor="end">-3</text><text x="930" y="168" font-size="13" font-weight="400" fill="#242424" >BER 10⁻¹⁰</text><path d="M65 185 L1180 185" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="216" font-size="15" font-weight="700" fill="#242424" >ONU C+ · G.984.2 부록 V</text><rect x="483.33333333333337" y="194" width="305.55555555555554" height="28" fill="#8a8a8a" stroke="#262626" stroke-width="1.6"/><text x="489.33333333333337" y="213" font-size="12.5" font-weight="700" fill="#f4f3ef" >-30</text><text x="782.8888888888889" y="213" font-size="12.5" font-weight="700" fill="#f4f3ef" text-anchor="end">-8</text><text x="930" y="213" font-size="13" font-weight="400" fill="#242424" >10⁻⁴ 정정 전, FEC</text><path d="M65 230 L1180 230" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="261" font-size="15" font-weight="700" fill="#242424" >OLT B+ · G.984.2 부속서 A</text><rect x="511.1111111111111" y="239" width="277.7777777777778" height="28" fill="#8a8a8a" stroke="#262626" stroke-width="1.6"/><text x="517.1111111111111" y="258" font-size="12.5" font-weight="700" fill="#f4f3ef" >-28</text><text x="782.8888888888889" y="258" font-size="12.5" font-weight="700" fill="#f4f3ef" text-anchor="end">-8</text><text x="930" y="258" font-size="13" font-weight="400" fill="#242424" >설계 목표 10⁻¹⁰</text><path d="M65 275 L1180 275" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="306" font-size="15" font-weight="700" fill="#242424" >OLT B+ · FS</text><rect x="511.1111111111111" y="284" width="277.7777777777778" height="28" fill="#d6d6d6" stroke="#262626" stroke-width="1.6"/><text x="517.1111111111111" y="303" font-size="12.5" font-weight="700" fill="#242424" >-28</text><text x="782.8888888888889" y="303" font-size="12.5" font-weight="700" fill="#242424" text-anchor="end">-8</text><text x="930" y="303" font-size="13" font-weight="400" fill="#242424" >BER 10⁻⁴</text><path d="M65 320 L1180 320" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="351" font-size="15" font-weight="700" fill="#242424" >OLT C+ · Cisco</text><rect x="469.44444444444446" y="329" width="263.8888888888889" height="28" fill="#d6d6d6" stroke="#262626" stroke-width="1.6"/><text x="475.44444444444446" y="348" font-size="12.5" font-weight="700" fill="#242424" >-31</text><text x="727.3333333333334" y="348" font-size="12.5" font-weight="700" fill="#242424" text-anchor="end">-12</text><text x="930" y="348" font-size="13" font-weight="400" fill="#242424" >BER 줄 없음</text><path d="M65 365 L1180 365" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="396" font-size="15" font-weight="700" fill="#242424" >OLT C+ · Trixon</text><rect x="483.33333333333337" y="374" width="250" height="28" fill="#d6d6d6" stroke="#262626" stroke-width="1.6"/><text x="489.33333333333337" y="393" font-size="12.5" font-weight="700" fill="#242424" >-30</text><text x="727.3333333333334" y="393" font-size="12.5" font-weight="700" fill="#242424" text-anchor="end">-12</text><text x="930" y="393" font-size="13" font-weight="400" fill="#242424" >BER 10⁻¹⁰ 직접 연결</text><path d="M65 410 L1180 410" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="441" font-size="15" font-weight="700" fill="#242424" >OLT C+ · Airlive 신판 (a)</text><rect x="483.33333333333337" y="419" width="250" height="28" fill="#d6d6d6" stroke="#262626" stroke-width="1.6"/><text x="489.33333333333337" y="438" font-size="12.5" font-weight="700" fill="#242424" >-30</text><text x="727.3333333333334" y="438" font-size="12.5" font-weight="700" fill="#242424" text-anchor="end">-12</text><text x="930" y="438" font-size="13" font-weight="400" fill="#242424" >BER 10⁻¹⁰</text><path d="M65 455 L1180 455" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="486" font-size="15" font-weight="700" fill="#242424" >OLT C+ · Airlive 신판 (b)</text><rect x="455.55555555555554" y="464" width="277.7777777777778" height="28" fill="#d6d6d6" stroke="#262626" stroke-width="1.6"/><text x="461.55555555555554" y="483" font-size="12.5" font-weight="700" fill="#242424" >-32</text><text x="727.3333333333334" y="483" font-size="12.5" font-weight="700" fill="#242424" text-anchor="end">-12</text><text x="930" y="483" font-size="13" font-weight="400" fill="#242424" >BER 10⁻⁴</text><path d="M65 500 L1180 500" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="531" font-size="15" font-weight="700" fill="#242424" >OLT C+ · G.984.2 부록 V</text><rect x="455.55555555555554" y="509" width="277.7777777777778" height="28" fill="#8a8a8a" stroke="#262626" stroke-width="1.6"/><text x="461.55555555555554" y="528" font-size="12.5" font-weight="700" fill="#f4f3ef" >-32</text><text x="727.3333333333334" y="528" font-size="12.5" font-weight="700" fill="#f4f3ef" text-anchor="end">-12</text><text x="930" y="528" font-size="13" font-weight="400" fill="#242424" >10⁻⁴ 정정 전, FEC</text><path d="M65 545 L1180 545" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="570" font-size="13" font-weight="700" fill="#242424" >음영 띠는 가상 계산입니다: C+ OLT(송신 +3에서 +7 dBm)가 손실 14 dB 선로를 거쳐 ONU에 전하는 수신 범위 −11에서 −7 dBm이며 ONU 과부하 −8 dBm을 넘습니다.</text><text x="65" y="592" font-size="12.5" font-weight="400" fill="#242424" >OLT 줄은 상향 수신, ONU 줄은 하향 수신입니다. 서로 다른 방향의 값이므로 줄 사이를 비교하지 않습니다. 부록 V는 표준의 필수 부분이 아닙니다.</text><text x="65" y="613" font-size="12.5" font-weight="400" fill="#6a6a6a" >Airlive 신판 (a)와 (b)는 한 사양서의 두 감도 줄입니다. 값은 제조사 공표값이며 이번에 시험한 값이 아닙니다.</text></g></svg>