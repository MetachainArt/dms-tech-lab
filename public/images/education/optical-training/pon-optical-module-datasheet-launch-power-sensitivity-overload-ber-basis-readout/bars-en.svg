-weight="700" fill="#242424" text-anchor="middle">-12</text><path d="M788.8888888888889 92 L788.8888888888889 546" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="788.8888888888889" y="86" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">-8</text><path d="M844.4444444444445 92 L844.4444444444445 546" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="844.4444444444445" y="86" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">-4</text><path d="M900 92 L900 546" stroke="#c9c8c2" stroke-width="1.2" fill="none"/><text x="900" y="86" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">0</text><text x="908" y="86" font-size="12" font-weight="400" fill="#6a6a6a" >dBm</text><rect x="747.2222222222222" y="96" width="55.55555555555566" height="135" fill="#262626" fill-opacity="0.13" stroke="#262626" stroke-width="1.4" stroke-dasharray="6 4"/><text x="65" y="126" font-size="14" font-weight="700" fill="#242424" >ONU B+ · G.984.2 Annex A</text><rect x="525" y="104" width="263.8888888888889" height="28" fill="#8a8a8a" stroke="#262626" stroke-width="1.6"/><text x="531" y="123" font-size="12.5" font-weight="700" fill="#f4f3ef" >-27</text><text x="782.8888888888889" y="123" font-size="12.5" font-weight="700" fill="#f4f3ef" text-anchor="end">-8</text><text x="930" y="123" font-size="12.5" font-weight="400" fill="#242424" >design goal 10⁻¹⁰</text><path d="M65 140 L1180 140" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="171" font-size="14" font-weight="700" fill="#242424" >ONU B+ · C-Light</text><rect x="511.1111111111111" y="149" width="347.2222222222223" height="28" fill="#d6d6d6" stroke="#262626" stroke-width="1.6"/><text x="517.1111111111111" y="168" font-size="12.5" font-weight="700" fill="#242424" >-28</text><text x="852.3333333333334" y="168" font-size="12.5" font-weight="700" fill="#242424" text-anchor="end">-3</text><text x="930" y="168" font-size="12.5" font-weight="400" fill="#242424" >