44444444446" y="329" width="263.8888888888889" height="28" fill="#d6d6d6" stroke="#262626" stroke-width="1.6"/><text x="475.44444444444446" y="348" font-size="12.5" font-weight="700" fill="#242424" >-31</text><text x="727.3333333333334" y="348" font-size="12.5" font-weight="700" fill="#242424" text-anchor="end">-12</text><text x="930" y="348" font-size="12.5" font-weight="400" fill="#242424" >no BER line</text><path d="M65 365 L1180 365" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="396" font-size="14" font-weight="700" fill="#242424" >OLT C+ · Trixon</text><rect x="483.33333333333337" y="374" width="250" height="28" fill="#d6d6d6" stroke="#262626" stroke-width="1.6"/><text x="489.33333333333337" y="393" font-size="12.5" font-weight="700" fill="#242424" >-30</text><text x="727.3333333333334" y="393" font-size="12.5" font-weight="700" fill="#242424" text-anchor="end">-12</text><text x="930" y="393" font-size="12.5" font-weight="400" fill="#242424" >10⁻¹⁰ back to back</text><path d="M65 410 L1180 410" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="441" font-size="14" font-weight="700" fill="#242424" >OLT C+ · Airlive newer (a)</text><rect x="483.33333333333337" y="419" width="250" height="28" fill="#d6d6d6" stroke="#262626" stroke-width="1.6"/><text x="489.33333333333337" y="438" font-size="12.5" font-weight="700" fill="#242424" >-30</text><text x="727.3333333333334" y="438" font-size="12.5" font-weight="700" fill="#242424" text-anchor="end">-12</text><text x="930" y="438" font-size="12.5" font-weight="400" fill="#242424" >BER 10⁻¹⁰</text><path d="M65 455 L1180 455" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="486" font-size="14" font-weight="700" fill="#242424" >OLT C+ · Airlive newer (b)</text><rect x="455.55555555555554" y="464" width="277.7777777777778" height="28" fill="#d6d6d6" stroke="#262626" stroke-width="1.6"/><text x="461.55555555555554" y="483" font-size="12.5" font-weight="700" fill="#242424" >-32</text><text x="727.3333333333334" y="483" font-size="12.5" font-weight="700" fill="#242424" text-anchor="end">-12</text><text x="930" y="483" font-size="12.5" font-weight="400" fill="#242424" >BER 10⁻⁴</text><path d="M65 500 L1180 500" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="531" font-size="14" font-weight="700" fill="#242424" >OLT C+ · G.984.2 App. V</text><rect x="455.55555555555554" y="509" width="277.7777777777778" height="28" fill="#8a8a8a" stroke="#262626" stroke-width="1.6"/><text x="461.55555555555554" y="528" font-size="12.5" font-weight="700" fill="#f4f3ef" >-32</text><text x="727.3333333333334" y="528" font-size="12.5" font-weight="700" fill="#f4f3ef" text-anchor="end">-12</text><text x="930" y="528" font-size="12.5" font-weight="400" fill="#242424" >10⁻⁴ pre-FEC</text><path d="M65 545 L1180 545" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="570" font-size="11.5" font-weight="700" fill="#242424" >Shading is a hypothetical calculation: a C+ OLT (+3 to +7 dBm launch) through a 14 dB path delivers −11 to −7 dBm to the ONU, which passes the ONU overload of −8 dBm.</text><text x="65" y="592" font-size="11.2" font-weight="400" fill="#242424" >OLT rows are upstream receive and ONU rows are downstream receive, so values are not compared between the two groups. Appendix V is not an integral part of the Recommendation.</text><text x="65" y="613" font-size="11.2" font-weight="400" fill="#6a6a6a" >Airlive newer (a) and (b) are two sensitivity lines of one datasheet. Values are published by the manufacturers, not tested here.</text></g></svg>