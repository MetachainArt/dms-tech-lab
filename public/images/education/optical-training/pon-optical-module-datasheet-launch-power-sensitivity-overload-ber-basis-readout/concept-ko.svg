<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="34" font-weight="700" fill="#242424" >PON 광모듈 사양서를 읽는 순서</text><text x="65" y="116" font-size="19" font-weight="400" fill="#6a6a6a" >ITU-T G.984.2, G.9807.1 개정 1과 제조사 사양서 13건 기준 · 개념도</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">방향과 클래스</text><text x="210" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">OLT 수신 · ONU 수신</text><text x="210" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">표준의 B+·C+ 또는 N1·N2</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">측정 기준</text><text x="600" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">BER · 소광비 · FEC</text><text x="600" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">같은 조건의 줄끼리 비교합니다</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">수신 창</text><text x="990" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">최소·최대 손실 양쪽</text><text x="990" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">과부하까지 계산합니다</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="16" font-weight="700" fill="#242424" text-anchor="middle">감도·과부하 줄은 어느 장비가 받는 값인지, 클래스 이름이 어느 표준의 것인지 먼저 적고 숫자만 옮기지 않습니다</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">BER·소광비·FEC가 다른 줄은 순위를 매기지 않고, 같은 조건의 줄끼리만 겹쳐 비교합니다</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">기록: 문서 코드·개정·날짜 · 방향과 클래스 · 감도·과부하와 BER 조건</text><text x="600" y="584" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">최대 입력과 파손 한계는 따로 · SD·LOS의 높은 값과 낮은 값 · DDM 정확도</text><text x="65" y="645" font-size="22" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>