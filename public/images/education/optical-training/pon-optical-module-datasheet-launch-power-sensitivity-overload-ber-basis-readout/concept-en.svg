<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="29" font-weight="700" fill="#242424" >Order for reading PON optical module datasheets</text><text x="65" y="116" font-size="15.5" font-weight="400" fill="#6a6a6a" >Based on ITU-T G.984.2, G.9807.1 Amendment 1 and 13 manufacturer datasheets · concept diagram</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Side and class</text><text x="210" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">OLT receive, ONU receive</text><text x="210" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">B+ and C+ or N1 and N2 of the standard</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Measurement basis</text><text x="600" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">BER, extinction ratio, FEC</text><text x="600" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">compare lines of the same basis</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Receive window</text><text x="990" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">minimum and maximum loss</text><text x="990" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">calculate up to overload</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="12.6" font-weight="700" fill="#242424" text-anchor="middle">Write which equipment receives the line and which standard the class name belongs to before copying any number</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="12.6" font-weight="700" fill="#242424" text-anchor="middle">Do not rank lines with different BER, extinction ratio or FEC; overlay only lines of the same basis</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="12.4" font-weight="700" fill="#242424" text-anchor="middle">Record: document code, revision, date, side and class, sensitivity, overload and BER condition</text><text x="600" y="584" font-size="12.4" font-weight="700" fill="#242424" text-anchor="middle">maximum input and damage limit apart, higher and lower SD or LOS values, DDM accuracy</text><text x="65" y="645" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>