<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#faf9f6"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#303030" stroke-width="1.3"/></marker></defs><g font-family="Malgun Gothic,Arial,sans-serif" fill="#303030"><text x="60" y="65" font-size="29" font-weight="700">사건 하나와 지정 구간은 다릅니다.</text><text x="60" y="117" font-size="22" font-weight="400">설명용 개념도 · 실제 파형/제품 치수 아님</text><line x1="100" y1="285" x2="1100" y2="285" stroke="#555" stroke-width="2" /><circle cx="300" cy="285" r="9" fill="#303030"/><path d="M300 274 q-25 -65 -85 -65" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><circle cx="600" cy="285" r="9" fill="#303030"/><path d="M600 274 q-25 -65 -85 -65" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><circle cx="900" cy="285" r="9" fill="#303030"/><path d="M900 274 q-25 -65 -85 -65" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><circle cx="600" cy="285" r="42" stroke="#303030" stroke-width="2" fill="none"/><text x="460" y="190" font-size="25" font-weight="700">사건 반사율</text><line x1="600" y1="200" x2="600" y2="240" stroke="#555" stroke-width="2" /><text x="180" y="345" font-size="26" font-weight="700">A</text><text x="1010" y="345" font-size="26" font-weight="700">B</text><line x1="180" y1="370" x2="1020" y2="370" stroke="#555" stroke-width="2" /><line x1="180" y1="354" x2="180" y2="387" stroke="#555" stroke-width="2" /><line x1="1020" y1="354" x2="1020" y2="387" stroke="#555" stroke-width="2" /><text x="225" y="430" font-size="26" font-weight="700">A–B 구간 ORL: 반사 + 광섬유 후방산란</text><line x1="60" y1="485" x2="1140" y2="485" stroke="#555" stroke-width="2" /><text x="60" y="545" font-size="26" font-weight="700">사건 반사율의 부호를 바꿔도 구간 ORL이 되지 않습니다.</text><text x="60" y="602" font-size="21" font-weight="400">구간 경계 · 기준면 · 파장 · 방향 · 모드를 함께 기록합니다.</text></g></svg>