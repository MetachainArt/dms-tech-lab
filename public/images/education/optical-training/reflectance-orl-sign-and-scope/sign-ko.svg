<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#faf9f6"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#303030" stroke-width="1.3"/></marker></defs><g font-family="Malgun Gothic,Arial,sans-serif" fill="#303030"><text x="60" y="65" font-size="27" font-weight="700">같은 대상 · 같은 기준면</text><text x="60" y="116" font-size="25" font-weight="400">가상 예: Pr(반사광) / Pi(입사광) = 1 / 100,000</text><line x1="600" y1="160" x2="600" y2="470" stroke="#555" stroke-width="2" /><text x="90" y="225" font-size="34" font-weight="700">반사율</text><text x="90" y="285" font-size="27" font-weight="400">10 log10(Pr / Pi)</text><text x="90" y="395" font-size="75" font-weight="700">-50 dB</text><text x="680" y="225" font-size="34" font-weight="700">반사손실</text><text x="680" y="285" font-size="27" font-weight="400">10 log10(Pi / Pr)</text><text x="680" y="395" font-size="75" font-weight="700">+50 dB</text><line x1="60" y1="495" x2="1140" y2="495" stroke="#555" stroke-width="2" /><text x="60" y="550" font-size="29" font-weight="700">부호 변환은 같은 비율에서만 가능합니다.</text><text x="60" y="603" font-size="21" font-weight="400">교육용 계산 · 실제 측정값/제품 합격선이 아닙니다.</text></g></svg>