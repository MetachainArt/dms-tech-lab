 width="345.6" height="46" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="755.6" y="490" font-size="18" font-weight="700" fill="#242424" >384</text><path d="M400 128 L400 532" stroke="#262626" stroke-width="1.6"/><path d="M400 532 L1120 532" stroke="#262626" stroke-width="1.6"/><path d="M400 532 L400 540" stroke="#262626" stroke-width="1.4"/><text x="400" y="559" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0</text><path d="M580 532 L580 540" stroke="#262626" stroke-width="1.4"/><text x="580" y="559" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">200</text><path d="M760 532 L760 540" stroke="#262626" stroke-width="1.4"/><text x="760" y="559" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">400</text><path d="M940 532 L940 540" stroke="#262626" stroke-width="1.4"/><text x="940" y="559" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">600</text><path d="M1120 532 L1120 540" stroke="#262626" stroke-width="1.4"/><text x="1120" y="559" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">800</text><text x="760" y="582" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">융착 수</text><text x="65" y="660" font-size="15" font-weight="400" fill="#242424" >모듈이 같아도 슬랙 보관 방식이 바뀌면 트레이 수가 줄어 용량이 달라집니다. 옅은 막대는 제조사가 적은 용량이 아닙니다.</text></g></svg>