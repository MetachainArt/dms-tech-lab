<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="30" font-weight="700" fill="#242424" >Order for reading one closure capacity line</text><text x="65" y="116" font-size="23" font-weight="400" fill="#6a6a6a" >Based on six manufacturer documents · concept diagram</text><rect x="65" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="160" y="240" font-size="19" font-weight="700" fill="#242424" text-anchor="middle">Splice method</text><text x="160" y="308" font-size="14" font-weight="400" fill="#6a6a6a" text-anchor="middle">single or ribbon</text><path d="M257 232 L277 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M267.0950818741206 236.78462087522354 L277 232 L267.0950818741206 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="279" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="374" y="240" font-size="17" font-weight="700" fill="#242424" text-anchor="middle">Module, sleeve</text><text x="374" y="308" font-size="14" font-weight="400" fill="#6a6a6a" text-anchor="middle">SM6, SM12, FIST</text><path d="M471 232 L491 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M481.0950818741206 236.78462087522354 L491 232 L481.0950818741206 227.21537912477646" stroke="#262626" stroke-width="2" fill="none"/><rect x="493" y="190" width="190" height="84" fill="none" stroke="#262626" stroke-width="3"/><text x="588" y="240" font-size="19" font-weight="700" fill="#242424" text-anchor="middle">Tray count</text><text x="588" y="308" font-size="14" font-weight="400" fill="#6a6a6a" text-anchor="middle">depends on the basket</text><path d="M685 232 L705 232" stroke="#262626" stroke-width="2" fill="none"/><path d="M695.0950818741205 236.78462087522354 L705 232 L695.0950818741205 227.21537912477646" stroke=