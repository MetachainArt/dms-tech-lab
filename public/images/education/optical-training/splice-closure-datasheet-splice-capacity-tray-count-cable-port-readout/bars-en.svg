<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="52" font-size="28" font-weight="700" fill="#242424" >D6 single-fiber capacity: module and tray count</text><text x="65" y="80" font-size="12" font-weight="400" fill="#6a6a6a" >CommScope FOSC 450 sixth edition · dark bars are printed values, light bars are DMS multiplication</text><rect x="760" y="98" width="22" height="14" fill="#555555" stroke="#262626" stroke-width="1.4"/><text x="790" y="110" font-size="15" font-weight="700" fill="#242424" >Printed in document</text><rect x="990" y="98" width="22" height="14" fill="#d8d6cf" stroke="#262626" stroke-width="1.4"/><text x="1020" y="110" font-size="15" font-weight="700" fill="#242424" >DMS multiplication</text><text x="65" y="174" font-size="15.5" font-weight="700" fill="#242424" >SM6, 8 trays</text><rect x="400" y="140" width="259.2" height="46" fill="#555555" stroke="#262626" stroke-width="1.6"/><text x="669.2" y="170" font-size="18" font-weight="700" fill="#242424" >288</text><text x="65" y="254" font-size="15.5" font-weight="700" fill="#242424" >SM12, 8 trays</text><rect x="400" y="220" width="518.4" height="46" fill="#555555" stroke="#262626" stroke-width="1.6"/><text x="928.4" y="250" font-size="18" font-weight="700" fill="#242424" >576</text><text x="65" y="334" font-size="15.5" font-weight="700" fill="#242424" >FIST, 8 trays</text><rect x="400" y="300" width="691.2" height="46" fill="#555555" stroke="#262626" stroke-width="1.6"/><text x="1101.2" y="330" font-size="18" font-weight="700" fill="#242424" >768</text><text x="65" y="414" font-size="15.5" font-weight="700" fill="#242424" >FIST, 6 trays (standard basket)</text><rect x="400" y="380" width="518.4" height="46" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="928.4" y="410" font-size="18" font-weight="700" fill="#242424" >576</text><text x="65" y="494" font-size="15.5" font-weight="700" fill="#242424" >FIST, 4 trays (tall basket)</text><rect x="400" y="460" width="345.6" height="46" fill="#d8d6cf" stroke="#262626" stroke-width="1.6"/><text x="755.6" y="490" font-size="18" font-weight="700" fill="#242424" >384</text><path d="M400 128 L400 532" stroke="#262626" stroke-width="1.6"/><path d="M400 532 L1120 532" stroke="#262626" stroke-width="1.6"/><path d="M400 532 L400 540" stroke="#262626" stroke-width="1.4"/><text x="400" y="559" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">0</text><path d="M580 532 L580 540" stroke="#262626" stroke-width="1.4"/><text x="580" y="559" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">200</text><path d="M760 532 L760 540" stroke="#262626" stroke-width="1.4"/><text x="760" y="559" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">400</text><path d="M940 532 L940 540" stroke="#262626" stroke-width="1.4"/><text x="940" y="559" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">600</text><path d="M1120 532 L1120 540" stroke="#262626" stroke-width="1.4"/><text x="1120" y="559" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">800</text><text x="760" y="582" font-size="15" font-weight="400" fill="#6a6a6a" text-anchor="middle">splices</text><text x="65" y="660" font-size="13.5" font-weight="400" fill="#242424" >With the same module, a different slack storage method lowers the tray count and the capacity. Light bars are not capacities the manufacturer printed.</text></g></svg>