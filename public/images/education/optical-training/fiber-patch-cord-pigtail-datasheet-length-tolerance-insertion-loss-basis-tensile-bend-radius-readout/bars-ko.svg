/><text x="898" y="551" font-size="13" font-weight="700" fill="#242424" >20</text><path d="M65 564 L1180 564" stroke="#d0cfc9" stroke-width="1" fill="none"/><text x="65" y="590" font-size="13" font-weight="700" fill="#242424" >FS의 굽힘 반경은 외경의 10배(동적)와 5배(정적)를 2.0 mm에 곱한 값이며 설치 중과 장기에 대응시킨 것은 DMS 해석입니다. Molex는 2.0 × 4.1 mm 이중 코드입니다.</text><text x="65" y="612" font-size="12.5" font-weight="400" fill="#6a6a6a" >값은 제조사가 공표한 값이며 이번에 시험한 값이 아닙니다. Fibline의 7.5 mm는 케이블 사양 줄에 적힌 값입니다.</text></g></svg>