<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="34" font-weight="700" fill="#242424" >점퍼 코드·피그테일 사양서를 읽는 순서</text><text x="65" y="116" font-size="19" font-weight="400" fill="#6a6a6a" >제조사·유통사 사양서 17건과 FOA 자료 3건 기준 · 개념도</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">길이 허용 오차</text><text x="210" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">플러스만 · 양쪽 · 구간</text><text x="210" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">부호와 구간을 먼저 적습니다</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">삽입손실 기준</text><text x="600" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">평균 · 97% · 최대</text><text x="600" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">커넥터 하나인지 코드 전체인지 적습니다</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">인장·굽힘</text><text x="990" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">설치 · 장기 · 외경별</text><text x="990" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">0.9 mm 피그테일은 따로 읽습니다</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="15" font-weight="700" fill="#242424" text-anchor="middle">반사 감쇠량은 부호와 연마 방식(UPC, APC)을 같이 옮기고 단면 형상은 수치나 성적서가 있는 문서를 고릅니다</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">받은 뒤: FOA-2 단일 종단 방법으로 코드마다 양쪽 커넥터를 하나씩 기준 코드와 맞대어 잽니다</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">기록: 문서 코드·판·날짜 · 허용 오차의 부호 · 손실 기준과 파장</text><text x="600" y="584" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">인장·굽힘 줄 이름과 외경 · 받은 뒤 시험 결과</text><text x="65" y="645" font-size="22" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>