<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="29" font-weight="700" fill="#242424" >Order for reading a patch cord and pigtail datasheet</text><text x="65" y="116" font-size="15.5" font-weight="400" fill="#6a6a6a" >Based on 17 manufacturer and distributor documents and 3 FOA pages · concept diagram</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Length tolerance</text><text x="210" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">plus-only, two-sided, bands</text><text x="210" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">Write the sign and bands first</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Loss basis</text><text x="600" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">average, 97%, maximum</text><text x="600" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">Write one connector or whole cord</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="22" font-weight="700" fill="#242424" text-anchor="middle">Tensile and bend</text><text x="990" y="288" font-size="12.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">install, long-term, per diameter</text><text x="990" y="312" font-size="12.5" font-weight="700" fill="#242424" text-anchor="middle">Read a 0.9 mm pigtail separately</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="12.2" font-weight="700" fill="#242424" text-anchor="middle">Copy the return loss sign with the polish type (UPC, APC), and pick documents with end-face numbers or a report</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="12.6" font-weight="700" fill="#242424" text-anchor="middle">After delivery: FOA-2 single-ended test, each connector of every cord against a reference cord, one at a time</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="12.4" font-weight="700" fill="#242424" text-anchor="middle">Record: document code, edition, date, tolerance sign, loss basis and wavelength</text><text x="600" y="584" font-size="12.4" font-weight="700" fill="#242424" text-anchor="middle">tensile and bend line names with diameter, results after delivery</text><text x="65" y="645" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>