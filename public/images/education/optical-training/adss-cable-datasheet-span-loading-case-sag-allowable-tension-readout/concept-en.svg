<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="29" font-weight="700" fill="#242424" >Order for reading span, loading case and tension lines</text><text x="65" y="116" font-size="19" font-weight="400" fill="#6a6a6a" >Based on Prysmian, TKF, Lexington Ames, Caledonian, Maintronics and UnitekFiber documents · concept diagram</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="23" font-weight="700" fill="#242424" text-anchor="middle">Loading case</text><text x="210" y="288" font-size="13.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">wind, ice thickness, temperature</text><text x="210" y="312" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">case name and numbers, fibre count line</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="23" font-weight="700" fill="#242424" text-anchor="middle">Sag</text><text x="600" y="288" font-size="13.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">initial, maximum loaded</text><text x="600" y="312" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">sag as a ratio to span is a DMS reading</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="23" font-weight="700" fill="#242424" text-anchor="middle">Tension</text><text x="990" y="288" font-size="13.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">MAT, MRCL, RTS, installation</text><text x="990" y="312" font-size="13" font-weight="700" fill="#242424" text-anchor="middle">keep daN, N and lbs in one unit</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="13.4" font-weight="700" fill="#242424" text-anchor="middle">Example: Prysmian ezSPAN 12 to 72 fibres · MRCL 1,025 lbs · 600 / 500 / 330 ft (Light / Medium / Heavy)</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="13.4" font-weight="700" fill="#242424" text-anchor="middle">The same cable has a different permitted span under a different case name</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="13.4" font-weight="700" fill="#242424" text-anchor="middle">Record: document code and page, loading case and fibre count, sag line and tension line</text><text x="600" y="584" font-size="13.4" font-weight="700" fill="#242424" text-anchor="middle">whether the pass criterion is a number or only a method number</text><text x="65" y="645" font-size="20" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>