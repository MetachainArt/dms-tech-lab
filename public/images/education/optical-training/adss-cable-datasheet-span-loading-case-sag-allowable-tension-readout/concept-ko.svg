<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f4f3ef"/><g font-family="Arial,Malgun Gothic,sans-serif"><text x="65" y="75" font-size="34" font-weight="700" fill="#242424" >경간·하중 조건·장력 줄을 읽는 순서</text><text x="65" y="116" font-size="22" font-weight="400" fill="#6a6a6a" >Prysmian, TKF, Lexington Ames, Caledonian, Maintronics, UnitekFiber 문서 기준 · 개념도</text><rect x="65" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="210" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">하중 조건</text><text x="210" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">풍속 · 얼음 두께 · 온도</text><text x="210" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">조건 이름과 수치, 심 수 줄</text><rect x="455" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">처짐</text><text x="600" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">초기 · 최대 부하</text><text x="600" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">경간에 대한 %로 읽는 것은 DMS 해석</text><rect x="845" y="170" width="290" height="92" fill="none" stroke="#262626" stroke-width="3"/><text x="990" y="222" font-size="26" font-weight="700" fill="#242424" text-anchor="middle">장력</text><text x="990" y="288" font-size="15.5" font-weight="400" fill="#6a6a6a" text-anchor="middle">MAT · MRCL · RTS · 설치</text><text x="990" y="312" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">daN · N · lbs 단위를 통일</text><rect x="65" y="340" width="1070" height="62" fill="none" stroke="#8a8a8a" stroke-width="2"/><text x="600" y="378" font-size="16" font-weight="700" fill="#242424" text-anchor="middle">예: Prysmian ezSPAN 12–72심 · MRCL 1,025 lbs · 600 / 500 / 330 ft (Light / Medium / Heavy)</text><path d="M600 316 L600 338" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M595.2153791247765 328.0950818741206 L600 338 L604.7846208752235 328.0950818741206" stroke="#8a8a8a" stroke-width="1.6" fill="none"/><path d="M600 402 L600 432" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 422.0950818741206 L600 432 L604.7846208752235 422.0950818741206" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="434" width="1070" height="62" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="472" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">같은 케이블도 조건 이름이 다르면 허용 경간이 달라집니다</text><path d="M600 496 L600 526" stroke="#262626" stroke-width="2" fill="none"/><path d="M595.2153791247765 516.0950818741205 L600 526 L604.7846208752235 516.0950818741205" stroke="#262626" stroke-width="2" fill="none"/><rect x="65" y="528" width="1070" height="78" fill="none" stroke="#262626" stroke-width="3"/><text x="600" y="558" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">기록: 문서 코드와 쪽 번호 · 하중 조건과 심 수 · 처짐 줄과 장력 줄</text><text x="600" y="584" font-size="15.5" font-weight="700" fill="#242424" text-anchor="middle">시험 합격 기준이 숫자인지 방법 번호뿐인지</text><text x="65" y="645" font-size="22" font-weight="700" fill="#242424" >DMS / OPTICAL TRAINING</text></g></svg>