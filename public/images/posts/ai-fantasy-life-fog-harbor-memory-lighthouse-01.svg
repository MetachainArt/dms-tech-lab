<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="짙은 안개가 깔린 항구와 청록빛 등대, 바닥에 새겨진 빛나는 좌표 선">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04121f"/>
      <stop offset="55%" stop-color="#0b2b45"/>
      <stop offset="100%" stop-color="#0f3d59"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d8e6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a5d8e6" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="beam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- fog bands -->
  <g>
    <rect y="360" width="1600" height="140" fill="url(#fog)"/>
    <rect y="520" width="1600" height="180" fill="url(#fog)" opacity="0.7"/>
    <rect y="700" width="1600" height="200" fill="url(#fog)" opacity="0.45"/>
  </g>

  <!-- lighthouse -->
  <g>
    <circle cx="800" cy="300" r="210" fill="url(#beam)"/>
    <polygon points="775,300 825,300 838,640 762,640" fill="#0d2c44" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="3"/>
    <rect x="762" y="268" width="76" height="46" rx="8" fill="#0a1f31" stroke="#67e8f9" stroke-width="3"/>
    <circle cx="800" cy="291" r="13" fill="#a5f3fc"/>
    <polygon points="762,268 800,222 838,268" fill="#0d2c44" stroke="#67e8f9" stroke-opacity="0.6" stroke-width="3"/>
    <g stroke="#67e8f9" stroke-opacity="0.35" stroke-width="2">
      <line x1="775" y1="380" x2="827" y2="380"/>
      <line x1="770" y1="460" x2="832" y2="460"/>
      <line x1="766" y1="540" x2="835" y2="540"/>
    </g>
  </g>

  <!-- light sweep -->
  <g fill="#7dd3fc" opacity="0.13">
    <polygon points="800,291 190,120 190,300"/>
    <polygon points="800,291 1410,120 1410,300"/>
  </g>

  <!-- dock line -->
  <line x1="0" y1="640" x2="1600" y2="640" stroke="#67e8f9" stroke-opacity="0.4" stroke-width="2"/>

  <!-- engraved coordinate lines on the dock floor -->
  <g stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2">
    <line x1="0" y1="700" x2="1600" y2="700"/>
    <line x1="0" y1="770" x2="1600" y2="770"/>
    <line x1="0" y1="845" x2="1600" y2="845"/>
    <line x1="120" y1="640" x2="20" y2="900"/>
    <line x1="420" y1="640" x2="360" y2="900"/>
    <line x1="800" y1="640" x2="800" y2="900"/>
    <line x1="1180" y1="640" x2="1240" y2="900"/>
    <line x1="1480" y1="640" x2="1580" y2="900"/>
  </g>

  <!-- glowing recall nodes -->
  <g fill="#a5f3fc">
    <circle cx="360" cy="770" r="7"/>
    <circle cx="800" cy="700" r="9"/>
    <circle cx="1240" cy="845" r="7"/>
    <circle cx="590" cy="845" r="5"/>
    <circle cx="1020" cy="770" r="5"/>
  </g>
  <g stroke="#a5f3fc" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M360 770 L590 845 L800 700 L1020 770 L1240 845"/>
  </g>

  <!-- moored boats -->
  <g stroke="#93c5fd" stroke-opacity="0.5" stroke-width="3" fill="none">
    <path d="M200 612 q60 34 120 0"/>
    <path d="M1300 612 q60 34 120 0"/>
    <line x1="260" y1="612" x2="260" y2="548"/>
    <line x1="1360" y1="612" x2="1360" y2="548"/>
  </g>
</svg>
