  <text x="170" y="788" fill="#5c6470" font-size="20" font-family="Arial, 'Malgun Gothic', 'Noto Sans KR', sans-serif" opacity="1">A useful handoff is not a file dump. It is a compact map of locked choices, open choices, risks, and acceptance rules.</text>
