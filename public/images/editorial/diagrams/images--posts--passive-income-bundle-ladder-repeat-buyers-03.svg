<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="상단 요약 바와 체크포인트가 포함된 번들 운영 대시보드" data-dms-edition="fiber-diagram-2026-09">
