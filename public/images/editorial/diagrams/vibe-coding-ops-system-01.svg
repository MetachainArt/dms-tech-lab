<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc"><title id="title">프롬프트보다 먼저, 운영 시스템</title><desc id="desc">요구사항의 문제정의·제약조건·완료조건, 단계별 구현, 다섯 검수 기준을 연결한 운영 보드.</desc><rect width="1280" height="760" fill="#f5f4ef"/><path d="M52 62H1228" stroke="#bbc4d0"/><text x="52" y="44" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="600" fill="#164fc5">DMS LABS / VIBE CODING</text><text x="52" y="122" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="40" font-weight="600" fill="#182a43">프롬프트보다 먼저, 운영 시스템</text><rect x="52" y="178" width="372" height="438" fill="#ffffff" stroke="#c7d0db"/><path d="M52 178H424" stroke="#174dc2" stroke-width="4"/><text x="76" y="230" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="32" font-weight="600" fill="#182a43">요구사항</text><text x="76" y="271" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#174dc2">판단 가능한 입력</text><text x="76" y="330" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="600" fill="#435368">문제정의</text><text x="76" y="373" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">누구의 어떤 행동을 바꿀까</text><text x="76" y="416" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="600" fill="#435368">제약조건</text><text x="76" y="459" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">기술 · 디자인 · 성능 조건</text><text x="76" y="502" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="600" fill="#435368">완료조건</text><text x="76" y="545" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">테스트 가능한 완료 기준</text><path d="M426 390h30m-10-10 10 10-10 10" fill="none" stroke="#174dc2" stroke-width="2"/><rect x="454" y="178" width="372" height="438" fill="#ffffff" stroke="#c7d0db"/><path d="M454 178H826" stroke="#174dc2" stroke-width="4"/><text x="478" y="230" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="32" font-weight="600" fill="#182a43">구현</text><text x="478" y="271" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#174dc2">단계를 나눈 생성</text><text x="478" y="330" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="600" fill="#435368">스켈레톤 생성</text><text x="478" y="373" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">구조 · 타입 · 데이터 흐름</text><text x="478" y="416" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="600" fill="#435368">기능 채움</text><text x="478" y="459" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">핵심 유스케이스 · 예외 처리</text><text x="478" y="502" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="600" fill="#435368">품질 마감</text><text x="478" y="545" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">테스트 · 접근성 · 성능</text><path d="M828 390h30m-10-10 10 10-10 10" fill="none" stroke="#174dc2" stroke-width="2"/><rect x="856" y="178" width="372" height="438" fill="#ffffff" stroke="#c7d0db"/><path d="M856 178H1228" stroke="#174dc2" stroke-width="4"/><text x="880" y="230" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="32" font-weight="600" fill="#182a43">검수</text><text x="880" y="271" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#174dc2">고정된 체크리스트</text><text x="880" y="330" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">정합성 · 요구사항 대응</text><text x="880" y="373" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">안전성 · 실패 처리 경로</text><text x="880" y="416" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">가독성 · 함수 책임 분리</text><text x="880" y="459" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">회귀방지 · 핵심 흐름 테스트</text><text x="880" y="502" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">운영성 · 로그와 모니터링</text><text x="52" y="657" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="24" font-weight="500" fill="#182a43">입력 규격 → 생성 단계 → 검수 기준을 한 운영 흐름으로 연결</text><path d="M52 700H1228" stroke="#bbc4d0"/><text x="52" y="732" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="400" fill="#435368">본문의 운영 원칙을 바탕으로 재구성한 교육 도식</text><text x="1080" y="732" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="600" fill="#164fc5">DMS / STUDY</text></svg>