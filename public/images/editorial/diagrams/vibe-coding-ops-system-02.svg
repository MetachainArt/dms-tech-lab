<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc"><title id="title">생산성과 품질을 지키는 생성 루프</title><desc id="desc">A 스켈레톤 생성에서 B 기능 채움, C 품질 마감으로 이어지는 본문 기반 세 단계 파이프라인.</desc><rect width="1280" height="760" fill="#f5f4ef"/><path d="M52 62H1228" stroke="#bbc4d0"/><text x="52" y="44" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="600" fill="#164fc5">DMS LABS / VIBE CODING</text><text x="52" y="122" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="40" font-weight="600" fill="#182a43">생산성과 품질을 지키는 생성 루프</text><rect x="52" y="185" width="372" height="410" fill="#ffffff" stroke="#c7d0db"/><path d="M52 185H424" stroke="#174dc2" stroke-width="4"/><text x="74" y="248" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="50" font-weight="600" fill="#174dc2">A</text><text x="74" y="305" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="29" font-weight="600" fill="#182a43">스켈레톤 생성</text><text x="74" y="370" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">폴더 구조 · 타입 경계</text><text x="74" y="413" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">데이터 흐름만 먼저 생성</text><text x="74" y="456" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">스타일 · 문구 · 세부 로직은 비움</text><path d="M74 505H402" stroke="#c7d0db"/><text x="74" y="550" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="500" fill="#174dc2">설계 충돌을 초기에 발견</text><path d="M426 395h30m-10-10 10 10-10 10" fill="none" stroke="#174dc2" stroke-width="2"/><rect x="454" y="185" width="372" height="410" fill="#ffffff" stroke="#c7d0db"/><path d="M454 185H826" stroke="#174dc2" stroke-width="4"/><text x="476" y="248" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="50" font-weight="600" fill="#174dc2">B</text><text x="476" y="305" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="29" font-weight="600" fill="#182a43">기능 채움</text><text x="476" y="370" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">핵심 유스케이스부터 구현</text><text x="476" y="413" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">예외 처리 경로 확정</text><text x="476" y="456" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">로깅 위치 함께 결정</text><path d="M476 505H804" stroke="#c7d0db"/><text x="476" y="550" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="500" fill="#174dc2">동작 가능성을 빠르게 검증</text><path d="M828 395h30m-10-10 10 10-10 10" fill="none" stroke="#174dc2" stroke-width="2"/><rect x="856" y="185" width="372" height="410" fill="#ffffff" stroke="#c7d0db"/><path d="M856 185H1228" stroke="#174dc2" stroke-width="4"/><text x="878" y="248" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="50" font-weight="600" fill="#174dc2">C</text><text x="878" y="305" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="29" font-weight="600" fill="#182a43">품질 마감</text><text x="878" y="370" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">테스트 · 접근성 · 성능</text><text x="878" y="413" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">카피 정리</text><text x="878" y="456" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="400" fill="#435368">규칙 단위로 소폭 리팩터링</text><path d="M878 505H1206" stroke="#c7d0db"/><text x="878" y="550" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="500" fill="#174dc2">배포 가능한 상태로 수렴</text><text x="52" y="657" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="23" font-weight="500" fill="#182a43">문제가 생기면 어긋난 단계를 확인하고, 해당 단계의 기준부터 수정</text><path d="M52 700H1228" stroke="#bbc4d0"/><text x="52" y="732" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="400" fill="#435368">본문의 운영 원칙을 바탕으로 재구성한 교육 도식</text><text x="1080" y="732" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="600" fill="#164fc5">DMS / STUDY</text></svg>